<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NOVA Social</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#07070b;--card:#101018;--card2:#171720;--card3:#1d1d27;
--text:#fff;--muted:#8d8d9b;--line:rgba(255,255,255,.08);
--p:#8b5cf6;--pink:#ec4899;--red:#ff416c;--green:#35d07f
}
html,body{
background:var(--bg);color:var(--text);min-height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
-webkit-tap-highlight-color:transparent
}
body{padding-bottom:78px;overflow-x:hidden}
body.chat-open{padding-bottom:0;overflow:hidden}
button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
input,textarea{
width:100%;background:var(--card2);color:var(--text);
border:1px solid var(--line);border-radius:15px;padding:13px;outline:none
}
input:focus,textarea:focus{border-color:#8b5cf666}
.app{max-width:680px;margin:auto}
.top{
height:64px;position:sticky;top:0;z-index:30;
background:rgba(7,7,11,.88);backdrop-filter:blur(20px);
border-bottom:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;padding:0 15px
}
body.chat-open .top{display:none}
.logo{
font-size:27px;font-weight:950;letter-spacing:-1px;
background:linear-gradient(90deg,var(--p),var(--pink));
-webkit-background-clip:text;color:transparent
}
.topBtns{display:flex;gap:7px}
.circle{
width:40px;height:40px;border-radius:50%;background:var(--card2);
display:grid;place-items:center;flex:none
}
.svg{width:20px;height:20px;display:block}
.circle .svg{width:19px;height:19px}
.screen{display:none;padding:13px}
.screen.active{display:block;animation:screenIn .22s ease}
@keyframes screenIn{
from{opacity:0;transform:translateY(7px)}
to{opacity:1;transform:none}
}
.title{font-size:27px;font-weight:900;margin:10px 3px 16px}
.card{
background:var(--card);border:1px solid var(--line);
border-radius:21px;margin-bottom:13px;overflow:hidden
}
.row{display:flex;align-items:center;gap:10px}
.avatar{
width:43px;height:43px;border-radius:50%;overflow:hidden;
display:grid;place-items:center;flex:none;
background:linear-gradient(135deg,var(--p),var(--pink));font-weight:900
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:36px;height:36px}
.avatar.big{width:92px;height:92px}
.avatar.online{
box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--green)
}
.createBar{display:flex;align-items:center;gap:9px;padding:12px}
.fakeInput{
flex:1;background:var(--card2);border-radius:18px;padding:12px;
color:var(--muted);text-align:left
}
.stories{
display:flex;gap:12px;overflow:auto;padding:4px 2px 16px;
scrollbar-width:none
}
.stories::-webkit-scrollbar{display:none}
.story{
min-width:68px;width:68px;text-align:center;color:var(--muted);font-size:10px
}
.storyRing{
width:64px;height:64px;border-radius:50%;padding:2px;margin:auto auto 5px;
background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b)
}
.storyInner{
width:100%;height:100%;border-radius:50%;background:var(--card2);
overflow:hidden;display:grid;place-items:center;font-size:25px
}
.storyInner img,.storyInner video{
width:100%;height:100%;object-fit:cover
}
.postHead{
display:flex;align-items:center;gap:10px;padding:13px
}
.userInfo{flex:1;min-width:0}
.name{font-weight:800;font-size:14px}
.handle,.time{font-size:11px;color:var(--muted)}
.postText{
padding:0 14px 13px;line-height:1.5;font-size:15px;
white-space:pre-wrap;overflow-wrap:anywhere
}
.media{
width:100%;max-height:620px;object-fit:cover;
background:#000;display:block
}
.actions{
display:flex;gap:3px;padding:8px;
border-top:1px solid var(--line);overflow:auto
}
.action{
min-width:42px;padding:9px;border-radius:12px;
color:var(--muted);display:flex;align-items:center;
justify-content:center;gap:4px
}
.action svg{width:18px;height:18px}
.action.active{
color:#ff3d72;background:rgba(255,61,114,.1)
}
.meta{font-size:11px;color:var(--muted);padding:0 14px 12px}
.commentPreview{padding:0 14px 14px;font-size:13px}
.btn{
background:linear-gradient(135deg,var(--p),var(--pink));
color:#fff;border-radius:14px;padding:11px 16px;font-weight:800
}
.btn.secondary{background:var(--card2)}
.btn.small{padding:8px 12px;font-size:12px}
.full{width:100%}
.search{margin-bottom:13px;position:relative}
.search input{padding-left:42px}
.searchIcon{
position:absolute;left:14px;top:12px;color:var(--muted)
}
.people{
display:flex;align-items:center;gap:10px;padding:13px;
border-bottom:1px solid var(--line)
}
.people:last-child{border-bottom:0}
.tabs{
display:flex;background:var(--card2);padding:4px;
border-radius:14px;margin-bottom:13px
}
.tab{
flex:1;padding:10px;color:var(--muted);border-radius:11px
}
.tab.active{background:var(--card);color:#fff;font-weight:800}
.profile{text-align:center;padding:18px}
.profile .avatar{margin:auto}
.profileName{font-size:24px;font-weight:900;margin-top:9px}
.bio{color:var(--muted);font-size:13px;margin:6px auto 15px}
.stats{display:flex;justify-content:center;gap:35px;margin:15px}
.stat b{display:block;font-size:19px}
.stat span{font-size:11px;color:var(--muted)}
.option{
display:flex;align-items:center;gap:12px;padding:14px;
border-bottom:1px solid var(--line)
}
.option:last-child{border-bottom:0}
.icon{width:28px;text-align:center}
.icon svg{width:20px;height:20px}
.optionMain{flex:1}
.optionMain b{display:block;font-size:14px}
.optionMain span{display:block;color:var(--muted);font-size:11px}
.bottom{
position:fixed;bottom:0;left:0;right:0;height:75px;z-index:50;
background:rgba(12,12,17,.94);backdrop-filter:blur(20px);
border-top:1px solid var(--line)
}
body.chat-open .bottom,
body.chat-open .fab{display:none}
.bottomIn{
max-width:680px;margin:auto;height:100%;
display:flex;justify-content:space-around
}
.nav{
width:58px;height:58px;margin-top:7px;border-radius:17px;
color:var(--muted);display:flex;flex-direction:column;
align-items:center;justify-content:center
}
.nav span{font-size:9px}
.nav.active{background:var(--card2);color:#fff}
.fab{
position:fixed;right:20px;bottom:90px;z-index:40;
width:56px;height:56px;border-radius:50%;
background:linear-gradient(135deg,var(--p),var(--pink));
color:#fff;font-size:28px;box-shadow:0 10px 35px #8b5cf655
}
.modalBg{
position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);
backdrop-filter:blur(8px);display:none;align-items:flex-end
}
.modalBg.open{display:flex}
.modal{
width:min(680px,100%);max-height:92vh;overflow:auto;
background:var(--card);border-radius:27px 27px 0 0;
padding:17px;animation:modalUp .22s ease
}
@keyframes modalUp{
from{transform:translateY(100%)}to{transform:none}
}
.modalHead{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:15px
}
.modalTitle{font-size:19px;font-weight:900}
.close{
width:38px;height:38px;border-radius:50%;
background:var(--card2);font-size:22px
}
.form{display:grid;gap:11px}
.preview{
width:100%;max-height:380px;object-fit:contain;border-radius:17px;
display:none;background:#000
}
.reactions{display:flex;flex-wrap:wrap;gap:7px}
.react{
width:48px;height:48px;border-radius:14px;
background:var(--card2);display:grid;place-items:center
}
.react svg{width:24px;height:24px}
.react.active{
background:rgba(139,92,246,.22);
box-shadow:0 0 0 1px #8b5cf666
}
.comments{max-height:45vh;overflow:auto}
.comment{
display:flex;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)
}
.commentBody{flex:1;font-size:13px}
.commentTime{font-size:10px;color:var(--muted)}

.chatListTitle{
display:flex;justify-content:space-between;align-items:center
}
.chatRow{
width:100%;display:flex;gap:10px;padding:14px;
border-bottom:1px solid var(--line);text-align:left;transition:.18s
}
.chatRow:active{background:var(--card2)}
.chatMain{flex:1;min-width:0}
.chatMain b{font-size:14px}
.chatMain div{
font-size:12px;color:var(--muted);white-space:nowrap;
overflow:hidden;text-overflow:ellipsis
}

/* =========================================================
   FULLSCREEN MOBILE CHAT
   ========================================================= */

body.chat-open #messages{
display:block;
padding:0;
margin:0;
width:100%;
height:100dvh;
min-height:100dvh;
animation:none;
}

.chat{
position:fixed;
inset:0;
z-index:80;
width:100%;
height:100dvh;
min-height:100dvh;
display:flex;
flex-direction:column;
background:var(--bg);
overflow:hidden;
padding-bottom:env(safe-area-inset-bottom);
}

.chatHead{
height:62px;
min-height:62px;
padding:7px 9px;
border-bottom:1px solid var(--line);
background:rgba(7,7,11,.94);
backdrop-filter:blur(22px);
display:flex;
align-items:center;
gap:4px;
z-index:5;
}

.chatHead .circle{
width:42px;
height:42px;
background:transparent
}

.chatHead .row[data-chat-profile]{
height:48px;
min-width:0;
padding:2px 5px;
border-radius:14px
}

.chatHead .row[data-chat-profile]:active{
background:var(--card2)
}

.chatHead .row[data-chat-profile] .avatar{
width:37px;
height:37px
}

.chatHead .row[data-chat-profile]>div:last-child{
min-width:0;
overflow:hidden
}

.chatHead .row[data-chat-profile] b{
display:block;
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.chatMessages{
flex:1;
min-height:0;
overflow-y:auto;
overflow-x:hidden;
-webkit-overflow-scrolling:touch;
overscroll-behavior:contain;
padding:14px 13px 12px;
scroll-behavior:smooth;
background-size:cover;
background-position:center;
border-radius:0;
}

.chatMessages.theme-dark{
background:linear-gradient(135deg,#090910,#141421)
}
.chatMessages.theme-purple{
background:linear-gradient(135deg,#161023,#251338)
}
.chatMessages.theme-blue{
background:linear-gradient(135deg,#07121c,#102637)
}
.chatMessages.theme-light{
background:linear-gradient(135deg,#edf1f7,#dce2ec)
}
.chatMessages.hasBg{
background-color:#08080c
}

/* message row */
.bubbleWrap{
position:relative;
margin:3px 0;
display:flex;
flex-direction:column;
transition:transform .18s ease;
width:100%;
touch-action:pan-y
}
.bubbleWrap.me{align-items:flex-end}
.bubbleWrap.them{align-items:flex-start}

/* TEXT BUBBLES ONLY */
.bubble{
position:relative;
max-width:min(78%,330px);
padding:8px 11px;
border-radius:18px;
font-size:14px;
line-height:1.4;
word-break:break-word;
transition:transform .18s,opacity .18s;
}

.bubble.me{
background:linear-gradient(135deg,var(--p),var(--pink));
border-bottom-right-radius:5px
}
.bubble.them{
background:var(--card2);
border-bottom-left-radius:5px
}
.bubble.deleted{
font-style:italic;
opacity:.55
}

/* IMPORTANT:
   PHOTO / VIDEO HAVE NO MESSAGE BUBBLE */
.mediaMessage{
position:relative;
display:flex;
flex-direction:column;
align-items:flex-start;
max-width:82%;
padding:0;
margin:0;
background:transparent;
border:0;
box-shadow:none
}
.bubbleWrap.me .mediaMessage{
align-items:flex-end
}

.chatMedia{
display:block;
width:auto;
max-width:min(300px,78vw);
max-height:min(430px,58vh);
object-fit:cover;
background:#000;
border-radius:17px;
padding:0;
margin:0;
box-shadow:0 2px 18px rgba(0,0,0,.18)
}

.chatMediaVideo{
display:block;
width:auto;
max-width:min(300px,78vw);
max-height:min(430px,58vh);
object-fit:contain;
background:#000;
border-radius:17px;
padding:0;
margin:0
}

/* media timestamp stays outside media */
.mediaTime{
font-size:8px;
color:#ffffff99;
margin-top:4px;
padding:0 4px;
line-height:1
}
.bubbleWrap.them .mediaTime{
color:#ffffff77
}

.msgTime{
font-size:8px;
opacity:.55;
text-align:right;
margin-top:3px
}

/* reaction no longer covers photo/video */
.msgReaction{
position:relative;
bottom:auto;
right:auto;
align-self:flex-end;
margin-top:3px;
background:var(--card);
border:1px solid var(--line);
border-radius:10px;
padding:3px 5px;
display:flex;
align-items:center;
gap:2px;
z-index:2;
box-shadow:0 3px 12px #0005
}
.bubbleWrap.them .msgReaction{
align-self:flex-start
}
.msgReaction svg{width:13px;height:13px}

.replyQuote{
font-size:10px;
padding:5px 7px;
border-left:2px solid #ffffff77;
margin-bottom:5px;
opacity:.72;
background:#00000018;
border-radius:5px;
max-width:100%
}

/* voice stays compact */
.voice{
display:flex;
align-items:center;
gap:8px;
min-width:190px
}
.voicePlay{
width:36px;height:36px;border-radius:50%;
background:#ffffff1d;display:grid;place-items:center
}
.voicePlay svg{width:16px;height:16px}
.wave{
display:flex;gap:2px;align-items:center;
height:26px;flex:1
}
.wave i{
display:block;width:3px;border-radius:3px;
background:#fff;opacity:.7
}
.voiceLike{
width:30px;height:30px;display:grid;place-items:center
}
.voiceLike svg{width:16px;height:16px}
.voiceLike.active{color:#ff4778}
.voiceTime{font-size:9px;opacity:.6}

.chatInputArea{
background:rgba(7,7,11,.96);
backdrop-filter:blur(20px);
border-top:1px solid var(--line);
padding:7px 9px calc(8px + env(safe-area-inset-bottom));
z-index:6;
flex:none
}

.chatInput{
display:flex;
gap:6px;
align-items:center;
width:100%;
padding:0
}

.chatInput input{
flex:1;
min-width:0;
height:43px;
padding:10px 13px;
border-radius:21px;
background:var(--card2);
border:1px solid var(--line)
}

.iconBtn{
width:42px;
height:42px;
border-radius:50%;
background:var(--card2);
display:grid;
place-items:center;
flex:none
}
.iconBtn:active{transform:scale(.94)}
.iconBtn svg{width:19px;height:19px}

.recording{
background:#24131c!important;
color:#ff5c83!important;
animation:pulse 1s infinite
}
@keyframes pulse{
50%{box-shadow:0 0 0 7px #ff416c18}
}

.replyBar{
display:none;
background:var(--card2);
border-radius:13px;
padding:8px 10px;
margin:0 0 7px;
align-items:center;
gap:8px
}
.replyBar.open{
display:flex;
animation:replyIn .18s ease
}
@keyframes replyIn{
from{opacity:0;transform:translateY(6px)}
to{opacity:1;transform:none}
}
.replyBarText{
flex:1;
font-size:11px;
color:var(--muted);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}
.replyClose{font-size:18px;color:var(--muted)}

.attachMenu{
display:none;
position:absolute;
bottom:52px;
left:0;
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:7px;
z-index:20;
box-shadow:0 15px 40px #0008
}
.attachMenu.open{display:grid}
.attachItem{
padding:11px 13px;
border-radius:12px;
display:flex;
gap:8px;
align-items:center;
white-space:nowrap
}
.attachItem:active{background:var(--card2)}
.chatInputWrap{position:relative;flex:none}

.chatProfileHeader{
padding:20px;text-align:center;background:var(--card);
border-radius:20px;margin-bottom:12px
}
.chatProfileHeader .avatar{margin:auto}
.profileGrid{
display:grid;grid-template-columns:repeat(3,1fr);gap:2px
}
.profileGrid img,.profileGrid video{
width:100%;aspect-ratio:1;object-fit:cover;background:#000
}
.empty{
text-align:center;color:var(--muted);padding:50px 20px
}
.empty b{display:block;color:#fff;margin-bottom:5px}
.toast{
position:fixed;z-index:300;bottom:95px;left:50%;
transform:translate(-50%,20px);opacity:0;background:#25252e;color:#fff;
padding:12px 17px;border-radius:15px;transition:.25s;
pointer-events:none;max-width:90%;text-align:center
}
.toast.show{
opacity:1;transform:translate(-50%,0)
}
.viewer{
position:fixed;inset:0;z-index:200;background:#000;
display:none;color:#fff
}
.viewer.open{display:block}
.viewerIn{
height:100%;max-width:520px;margin:auto;
position:relative;overflow:hidden
}
.viewerMedia{
width:100%;height:100%;object-fit:contain;background:#000
}
.viewerText{
width:100%;height:100%;display:grid;place-items:center;
text-align:center;padding:40px;font-size:34px;font-weight:900;
background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b)
}
.viewerTop{
position:absolute;top:13px;left:12px;right:12px;z-index:8
}
.progress{
height:3px;background:#ffffff55;border-radius:10px
}
.viewerClose{
position:absolute;right:12px;top:18px;
z-index:20;font-size:30px
}
.viewerNav{
position:absolute;inset:0;display:flex;z-index:5
}
.viewerSide{flex:1}
.viewerBottom{
position:absolute;bottom:17px;left:12px;right:12px;
z-index:10;display:flex;gap:6px
}
.viewerBottom input{
background:#111c;border-color:#ffffff22;color:#fff
}
.viewerBtn{
width:45px;height:45px;border-radius:50%;
background:#ffffff22;color:#fff;display:grid;place-items:center
}
.viewerBtn svg{width:19px;height:19px}
.storyReactRow{
display:flex;gap:5px;overflow:auto;
position:absolute;bottom:72px;left:12px;right:12px;z-index:10
}
.storyReactRow button{
min-width:42px;height:42px;background:#ffffff1c;
border-radius:13px;display:grid;place-items:center
}
.storyReactRow button.active{
background:#ffffff35;
box-shadow:0 0 0 1px #ffffff55
}
.storyReactRow svg{width:21px;height:21px}
.storyReplies{
position:absolute;left:12px;right:12px;bottom:125px;
max-height:28vh;overflow:auto;z-index:9
}
.storyReply{
background:#111d;padding:9px 11px;
border-radius:14px;margin:5px 0;font-size:12px
}
.longPressShade{
position:fixed;inset:0;z-index:500;
background:rgba(0,0,0,.48);
backdrop-filter:blur(13px);
display:none;align-items:flex-end
}
.longPressShade.open{display:flex}
.longMenu{
width:min(680px,100%);
background:rgba(25,25,34,.97);
border-radius:28px 28px 0 0;
padding:12px;animation:modalUp .18s ease
}
.longPreview{
background:var(--card);border-radius:17px;
padding:5px;margin-bottom:8px;
max-height:180px;overflow:hidden
}
.longActions{display:grid;gap:4px}
.longAction{
padding:15px;border-radius:14px;text-align:left;
background:transparent;display:flex;gap:12px;align-items:center
}
.longAction svg{width:20px;height:20px}
.longAction:active{background:var(--card2)}
.reactRow{
display:flex;gap:4px;background:var(--card);
border:1px solid var(--line);border-radius:20px;
padding:7px;margin-bottom:8px;overflow:auto
}
.reactChoice{
min-width:42px;height:42px;border-radius:14px;
background:var(--card2);display:grid;place-items:center
}
.reactChoice svg{width:20px;height:20px}
.auth{
position:fixed;inset:0;z-index:1000;
background:radial-gradient(circle at top right,#321657,#08080d 45%);
display:none;overflow:auto
}
.authWrap{
min-height:100%;width:min(440px,100%);margin:auto;
padding:25px 20px;display:flex;flex-direction:column;
justify-content:center
}
.authLogo{
text-align:center;font-size:52px;font-weight:950;
letter-spacing:-4px;
background:linear-gradient(90deg,var(--p),var(--pink));
-webkit-background-clip:text;color:transparent
}
.authSub{text-align:center;color:#9999aa;margin:5px 0 25px}
.authCard{
background:#12121bdd;border:1px solid #ffffff12;
border-radius:28px;padding:18px
}
.authTabs{
display:flex;background:#0d0d14;padding:4px;
border-radius:15px;margin-bottom:18px
}
.authTab{
flex:1;padding:11px;border-radius:11px;color:#999
}
.authTab.active{
background:#20202b;color:#fff;font-weight:800
}
.authForm{display:grid;gap:11px}
.authForm h2{font-size:22px}
.authHelp{font-size:11px;color:#888;line-height:1.5}
.authError{font-size:12px;color:#ff718f;min-height:17px}
.onlineDot{
width:8px;height:8px;border-radius:50%;
background:var(--green);display:inline-block
}
.hidden{display:none!important}
.smallText{font-size:11px;color:var(--muted)}

<script>
const $=id=>document.getElementById(id);

const NOVA={
state:{
screen:"home",
storyUser:null,
storyIndex:0,
profileTab:"posts",
search:"",
activeChat:null,
chatProfile:null,
replyTo:null,
chatTheme:{},
pressTimer:null,
storyTimer:null,
storyPausedByLongPress:false
},

uid(p="id"){
return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9)
},

esc(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
},

time(t){
let n=Date.now()-Number(t);
if(n<60000)return"now";
if(n<3600000)return Math.floor(n/60000)+"m";
if(n<86400000)return Math.floor(n/3600000)+"h";
if(n<604800000)return Math.floor(n/86400000)+"d";
return new Date(Number(t)).toLocaleDateString()
},

get(k,d){
try{
let x=localStorage.getItem("NOVA_"+k);
return x?JSON.parse(x):d
}catch(e){return d}
},

set(k,v){
try{localStorage.setItem("NOVA_"+k,JSON.stringify(v))}
catch(e){}
},

toast(t){
let x=$("toast");
if(!x)return;
x.textContent=t;
x.classList.add("show");
clearTimeout(this.toastT);
this.toastT=setTimeout(()=>x.classList.remove("show"),2200)
},

modal(t,h){
$("modalTitle").textContent=t;
$("modalBody").innerHTML=h;
$("modalBg").classList.add("open")
},

closeModal(){
$("modalBg").classList.remove("open")
},

go(s){
this.state.screen=s;

if(s!=="messages"||!this.state.activeChat){
document.body.classList.remove("chat-open")
}

document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
$(s).classList.add("active");

document.querySelectorAll(".nav").forEach(x=>
x.classList.toggle("active",x.dataset.go===s)
);

this.render(s);
window.scrollTo(0,0)
},

render(s){
if(modules[s]?.render)modules[s].render()
},

async image(file){
return new Promise(resolve=>{
if(!file)return resolve("");
let r=new FileReader;
r.onload=()=>resolve(r.result);
r.onerror=()=>resolve("");
r.readAsDataURL(file)
} )
},

async hashText(v){
if(window.crypto?.subtle){
let b=await crypto.subtle.digest(
"SHA-256",new TextEncoder().encode(v)
);
return [...new Uint8Array(b)]
.map(x=>x.toString(16).padStart(2,"0")).join("")
}
let h=0;
for(let i=0;i<v.length;i++)
h=((h<<5)-h)+v.charCodeAt(i)|0;
return String(h)
}
};

});

this.save()
},

save(){
[
"users","posts","stories","messages",
"notifications","settings","chats"
].forEach(k=>NOVA.set(k,this[k]))
},

me(){
return this.user(auth.session?.userId||"me")
},

user(id){
return this.users.find(x=>x.id===id)
},

post(id){
return this.posts.find(x=>x.id===id)
},

following(id){
return(this.me()?.followingUsers||[]).includes(id)
},

follow(id){
let m=this.me(),u=this.user(id);
if(!u||!m)return;

m.followingUsers??=[];

if(!m.followingUsers.includes(id)){
m.followingUsers.push(id);
m.following++;
u.followers++;
}

this.save()
},

unfollow(id){
let m=this.me(),u=this.user(id);

m.followingUsers=(m.followingUsers||[])
.filter(x=>x!==id);

m.following=Math.max(0,m.following-1);

if(u)u.followers=Math.max(0,u.followers-1);

this.save()
},

notify(type,user,text,extra={}){
if(!this.settings.notifications)return;

this.notifications.unshift({
id:NOVA.uid("notif"),
type,
user,
text,
time:Date.now(),
read:false,
...extra
});

this.notifications=this.notifications.slice(0,100);
this.save()
},

chatKey(a,b){
return[a,b].sort().join("__")
},

chat(a,b){

let k=this.chatKey(a,b);

if(!this.chats[k]){
this.chats[k]=[];
}

if(!Array.isArray(this.chats[k])){
this.chats[k]=this.chats[k].messages||[];
}

this.chats[k].forEach(m=>{
m.reactionBy??={}
});

return this.chats[k]
},

sendMessage(to,obj){

let me=this.me()?.id;

if(!me||!to)return null;

let arr=this.chat(me,to);

let msg={
id:NOVA.uid("msg"),
from:me,
to,
time:Date.now(),
kind:"text",
text:"",
replyTo:null,
reactionBy:{},
...obj
};

arr.push(msg);

this.save();

return msg
}
};

const ui={
avatar(u,cl=""){
if(!u)return`<div class="avatar ${cl}">?</div>`;

return u.avatar
?`<div class="avatar ${cl} ${u.online?"online":""}">
<img src="${NOVA.esc(u.avatar)}">
</div>`
:`<div class="avatar ${cl} ${u.online?"online":""}">

</div>`
},

head(u,p){
return`<div class="postHead" data-user="${u.id}">
${this.avatar(u)}
<div class="userInfo">
<div class="name">${NOVA.esc(u.name)}</div>
<div class="handle">${NOVA.esc(u.handle)}</div>

text(t){

/(^|\s)(#[a-zA-Z0-9_]+)/g,
'$1<span style="color:#a78bfa;font-weight:700">$2</span>'
)
},

reaction(type){
return ICONS[type]||ICONS.heart
}
};

modules.stories={

grouped(){

let map=new Map;

[...modules.db.stories]
.sort((a,b)=>a.created-b.created)
.forEach(s=>{

if(!map.has(s.user))map.set(s.user,[]);

map.get(s.user).push(s)
});

return[...map.entries()]
.map(([user,items])=>({user,items}))
},

stopVideo(){

let v=$("storyVideo");

if(v){
try{
v.pause();
v.removeAttribute("src");
v.load()
}catch(e){}
}

clearTimeout(NOVA.state.storyTimer);
NOVA.state.storyTimer=null;
NOVA.state.storyPausedByLongPress=false
},

<button class="story" data-story-create>
<div class="storyRing">
<div class="storyInner">
<svg class="svg" viewBox="0 0 24 24"
fill="none" stroke="currentColor" stroke-width="2">
<path d="M12 5v14M5 12h14"/>
</svg>
</div>
</div>
Your story

${groups.map(g=>{

<div class="storyInner">
${
s.media

</div>
${NOVA.esc((u?.name||"User").split(" ")[0])}
</button>`

</div>`
},

create(){

<div class="form">

<textarea id="storyText" rows="4"
placeholder="Write your story..."></textarea>

<input id="storyFile" type="file"
accept="image/*,video/*">

<video id="storyVideoPreview"
class="preview" playsinline muted></video>

<img id="storyImagePreview" class="preview">

<div id="storyFileInfo" class="smallText"></div>

<button class="btn full" data-story-submit>
Share story
</button>

</div>`);

$("storyFile").onchange=e=>
this.file(e.target.files[0])
},

async file(f){

if(!f)return;

let data=await NOVA.image(f);

$("storyImagePreview").style.display="none";
$("storyVideoPreview").style.display="none";

if(f.type.startsWith("video/")){

$("storyVideoPreview").src=data;
$("storyVideoPreview").dataset.data=data;
$("storyVideoPreview").dataset.type="video";
$("storyVideoPreview").style.display="block";
$("storyFileInfo").textContent="Video selected"

}else{

$("storyImagePreview").src=data;
$("storyImagePreview").dataset.data=data;
$("storyImagePreview").dataset.type="image";
$("storyImagePreview").style.display="block";
$("storyFileInfo").textContent="Photo selected"

}
},

submit(){

let t=$("storyText").value.trim();
let v=$("storyVideoPreview");
let i=$("storyImagePreview");

let media=v.dataset.data||i.dataset.data||"";
let type=v.dataset.type||i.dataset.type||"text";

if(!t&&!media)
return NOVA.toast("Add text or media");

let d=modules.db;
let m=d.me();

d.stories.push({
id:NOVA.uid("story"),
user:m.id,
text:t,
media,
mediaType:type,
reactions:{},
replies:[],
created:Date.now()
});

d.save();
NOVA.closeModal();
NOVA.render("home");
NOVA.toast("Story added ✨")
},

openUser(id){

this.stopVideo();

NOVA.state.storyUser=id;
NOVA.state.storyIndex=0;

this.show()
},

this.stopVideo();

let id=NOVA.state.storyUser;

let list=this.grouped()
.find(x=>x.user===id)?.items||[];

if(!list.length)return this.close();

if(NOVA.state.storyIndex>=list.length)
NOVA.state.storyIndex=list.length-1;

let s=list[NOVA.state.storyIndex];
let u=modules.db.user(id);

let reactions=[
"heart","laugh","wow","fire",
"like","sad","angry"
];

let myReaction=null;

Object.keys(s.reactions||{}).forEach(k=>{
if((s.reactions[k]||[]).includes(modules.db.me().id))
myReaction=k

<div class="row" style="margin-top:9px">

${ui.avatar(u,"sm")}

id="storyVideo"

playsinline

></video>`
:`<img class="viewerMedia"
src="${NOVA.esc(s.media)}">`
:`<div class="viewerText">${ui.text(s.text)}</div>`
}

${s.text&&s.media
?`<div style="
position:absolute;bottom:155px;left:15px;right:15px;
z-index:9;background:#0007;padding:10px;
border-radius:13px">${ui.text(s.text)}</div>`
:""}

<button class="viewerSide" data-story-next></button>
</div>

<div class="storyReplies">

${(s.replies||[]).map(r=>{

let x=modules.db.user(r.user);

return`<div class="storyReply">
<b>${NOVA.esc(x?.name||"User")}</b>
${NOVA.esc(r.text)}

</div>

class="${myReaction===x?"active":""}"

placeholder="Reply to story...">

<button class="viewerBtn" data-story-reply>
${ICONS.send}
</button>

</div>
`;

$("viewer").classList.add("open");

let vid=$("storyVideo");

if(vid){

vid.muted=false;

let playPromise=vid.play();

if(playPromise?.catch){
playPromise.catch(()=>{
vid.muted=true;
vid.play().catch(()=>{})
})
}

let pressTimer=null;

const startPress=()=>{
clearTimeout(pressTimer);

pressTimer=setTimeout(()=>{

NOVA.state.storyPausedByLongPress=true;

try{vid.pause()}catch(err){}

},420)
};

const endPress=()=>{
clearTimeout(pressTimer);

if(NOVA.state.storyPausedByLongPress){

NOVA.state.storyPausedByLongPress=false;

if(!vid.ended){
vid.play().catch(()=>{})
}

}
};

vid.addEventListener("pointerdown",startPress);
vid.addEventListener("pointerup",endPress);
vid.addEventListener("pointercancel",endPress);
vid.addEventListener("pointerleave",endPress);

vid.addEventListener("ended",()=>{
if($("viewer").classList.contains("open"))
this.next()
});

}

current=k;

.filter(x=>x!==me);

async record(id){

if(
!navigator.mediaDevices?.getUserMedia||
!window.MediaRecorder
)
return NOVA.toast(
"Voice recording is not supported in this browser"
);

if(NOVA.recording)
return;

try{

let stream=
await navigator.mediaDevices.getUserMedia({audio:true});

let chunks=[];

let mime="";

if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus"))
mime="audio/webm;codecs=opus";
else if(MediaRecorder.isTypeSupported("audio/webm"))
mime="audio/webm";

let rec=mime
?new MediaRecorder(stream,{mimeType:mime})
:new MediaRecorder(stream);

NOVA.recording=rec;
NOVA.recordingStarted=Date.now();

let btn=$("voiceBtn");

btn?.classList.add("recording");

rec.ondataavailable=e=>{
if(e.data.size)
chunks.push(e.data)
};

rec.onstop=()=>{

stream.getTracks().forEach(t=>t.stop());

let duration=Math.max(
1,
Math.round(
(Date.now()-NOVA.recordingStarted)/1000
)
);

let blob=new Blob(chunks,{
type:rec.mimeType||"audio/webm"
});

let reader=new FileReader;

reader.onload=()=>{

let msg=modules.db.sendMessage(
id,
{
kind:"voice",
data:reader.result,
duration,
voiceLiked:[]
}
);

NOVA.recording=null;

if(btn)
btn.classList.remove("recording");

if(msg){

modules.db.notify(
"message",
modules.db.me().id,
"sent a voice message",
{chat:id}
);

this.chat(id);
NOVA.toast("Voice sent")

}

};

reader.readAsDataURL(blob)

};

rec.start();

NOVA.toast("Recording… release to send");

}catch(e){

NOVA.recording=null;

$("voiceBtn")?.classList.remove("recording");

NOVA.toast("Microphone permission is needed")

}
},

stopRecord(){

if(NOVA.recording){

try{
NOVA.recording.stop()
}catch(e){}

$("voiceBtn")?.classList.remove("recording")
}
},

async derive(password,salt){

if(!crypto?.subtle)
return NOVA.hashText(password+JSON.stringify(salt));

let key=await crypto.subtle.importKey(
"raw",
new TextEncoder().encode(password),
"PBKDF2",
false,
["deriveBits"]
);

let bits=await crypto.subtle.deriveBits(
{
name:"PBKDF2",
salt:new Uint8Array(salt),
iterations:120000,
hash:"SHA-256"
},
key,
256
);

return[...new Uint8Array(bits)]
.map(x=>x.toString(16).padStart(2,"0"))
.join("")
},

async hash(password){

let salt=crypto.getRandomValues(
new Uint8Array(16)
);

return{
salt:[...salt],
hash:await this.derive(password,salt)
}
},

async register(){

let n=$("regName").value.trim();
let e=$("regEmail").value.trim().toLowerCase();
let p=$("regPass").value;
let p2=$("regPass2").value;
let h=$("regHandle").value.trim();

$("authError").textContent="";

if(n.length<2)
return $("authError").textContent="Enter your name.";

if(!e.includes("@"))
return $("authError").textContent=
"Enter an email-like address.";

if(p.length<6)
return $("authError").textContent=
"Password must be at least 6 characters.";

if(p!==p2)
return $("authError").textContent=
"Passwords do not match.";

if(this.accounts.some(x=>x.email===e))
return $("authError").textContent=
"Account already exists.";

if(!h)
h="@"+
n.toLowerCase()
.replace(/[^a-z0-9]/g,"")
.slice(0,14)+
Math.floor(Math.random()*90+10);

if(!h.startsWith("@"))
h="@"+h;

let id=this.accounts.length===0
?"me"
:NOVA.uid("user");

let sec=await this.hash(p);

let old=modules.db.user(id);

if(old){

old.name=n;
old.handle=h;
old.online=true

}else{

modules.db.users.push({
id,
name:n,
handle:h,
bio:"New on NOVA 🚀",
avatar:"",
followers:0,
following:0,
followingUsers:[],
online:true
})

}

this.accounts.push({
id,
email:e,
passwordHash:sec.hash,
salt:sec.salt,
userId:id,
created:Date.now()
});

NOVA.set("accounts",this.accounts);

this.session={
userId:id,
email:e
};

NOVA.set("session",this.session);

modules.db.save();

this.hide();

NOVA.go("home");

NOVA.toast("Account created 🚀")
},

async login(){

let e=$("loginEmail").value.trim().toLowerCase();
let p=$("loginPass").value;

$("authError").textContent="";

let a=this.accounts.find(x=>x.email===e);

if(!a)
return $("authError").textContent=
"Account not found.";

let h=await this.derive(
p,
a.salt
);

if(h!==a.passwordHash)
return $("authError").textContent=
"Wrong password.";

this.session={
userId:a.userId,
email:a.email
};

NOVA.set("session",this.session);

let u=modules.db.user(a.userId);

if(u)
u.online=true;

modules.db.save();

this.hide();

NOVA.go("home");

NOVA.toast("Welcome back ✨")
},

function applyMessageReaction(id,type){

let arr=modules.db.chat(
modules.db.me().id,
NOVA.state.activeChat
);

let m=arr.find(x=>x.id===id);

let me=modules.db.me().id;

if(!m)return;

m.reactionBy??={};

let current=m.reactionBy[me]||null;

if(current===type){

delete m.reactionBy[me]

}else{

m.reactionBy[me]=type;

if(m.from!==me){

modules.db.notify(
"message_reaction",
me,
"reacted to your message",
{
chat:NOVA.state.activeChat,
messageId:id
}
);

}
}

modules.db.save();

closeLong();

modules.messages.chat(
NOVA.state.activeChat
)
}

function deleteMessage(id){

let arr=modules.db.chat(
modules.db.me().id,
NOVA.state.activeChat
);

let m=arr.find(x=>x.id===id);

if(
m&&
m.from===modules.db.me().id
){

m.deleted=true;
m.text="";
m.data="";
m.reactionBy={};

modules.db.save();

closeLong();

modules.messages.chat(
NOVA.state.activeChat
);

NOVA.toast("Message deleted")
}
}

if(confirm("Delete all NOVA local data?")){
localStorage.clear();
location.reload()
}

}

if(x==="notifications")
modules.notifications.show();

if(x==="search"){

NOVA.go("explore");

setTimeout(
()=>$("exploreSearch")?.focus(),
60
)

}

return
}

let sc=e.target.closest("[data-story-create]");

if(sc){

modules.stories.create();
return
}

let su=e.target.closest("[data-story-user]");

if(su){

modules.stories.openUser(
su.dataset.storyUser
);

return
}

let sr=e.target.closest("[data-story-react]");

if(sr){

modules.stories.react(
sr.dataset.storyReact
);

return
}

if(e.target.closest("[data-story-reply]")){

modules.stories.reply();
return
}

if(e.target.closest("[data-story-close]")){

modules.stories.close();
return
}

if(e.target.closest("[data-story-next]")){

modules.stories.next();
return
}

if(e.target.closest("[data-story-prev]")){

modules.stories.prev();
return
}

let pf=e.target.closest("[data-profile-tab]");

if(pf){

let owner=
pf.dataset.profileOwner||
modules.db.me().id;

NOVA.state.profileTab=
pf.dataset.profileTab;

modules.profile.renderUser(
owner,
owner===modules.db.me().id
);

return
}

let fl=e.target.closest("[data-follow]");

if(fl){

let id=fl.dataset.follow;

modules.db.following(id)
?modules.db.unfollow(id)
:modules.db.follow(id);

NOVA.render(NOVA.state.screen);

return
}

let user=e.target.closest("[data-user]");

if(
user&&
!e.target.closest("[data-follow]")
){

modules.profile.showUser(
user.dataset.user
);

return
}

let po=e.target.closest("[data-post]");

if(po){

let id=po.dataset.id;
let x=po.dataset.post;

if(x==="like")modules.posts.like(id);
if(x==="comments")modules.posts.comments(id);
if(x==="reaction")modules.posts.reaction(id);
if(x==="repost")modules.posts.repost(id);
if(x==="save")modules.posts.save(id);
if(x==="share")modules.posts.share(id);
if(x==="menu")modules.posts.menu(id);

return
}

let rr=e.target.closest("[data-reaction]");

if(rr){

modules.posts.react(
rr.dataset.id,
rr.dataset.reaction
);

return
}

let cm=e.target.closest("[data-comment]");

if(cm){

modules.posts.addComment(
cm.dataset.comment
);

return
}

let menu=e.target.closest("[data-menu]");

if(menu){

if(menu.dataset.menu==="stats"){

let p=modules.db.post(
menu.dataset.id
);

NOVA.modal(
"Statistics",
`<div class="empty">
<b>${p.likes.length}</b> Likes
<br><br>
<b>${p.comments.length}</b> Comments
<br><br>
<b>${p.reposts||0}</b> Reposts
</div>`
)

}

if(menu.dataset.menu==="delete"){

if(confirm("Delete this post?")){

modules.db.posts=
modules.db.posts.filter(
x=>x.id!==menu.dataset.id
);

modules.db.save();

NOVA.closeModal();

NOVA.render(
NOVA.state.screen
)

}

}

return
}

if(e.target.closest("[data-profile-save]")){

modules.profile.save();
return
}

if(e.target.closest("[data-create-submit]")){

modules.posts.submit();
return
}

if(e.target.closest("[data-story-submit]")){

modules.stories.submit();
return
}

let chat=e.target.closest("[data-chat]");

if(chat){

NOVA.state.activeChat=
chat.dataset.chat;

NOVA.state.chatProfile=null;
NOVA.state.replyTo=null;

NOVA.go("messages");

return
}

if(e.target.closest("[data-chat-back]")){

NOVA.state.activeChat=null;
NOVA.state.chatProfile=null;
NOVA.state.replyTo=null;

document.body.classList.remove("chat-open");

NOVA.go("messages");

return
}

let cp=e.target.closest("[data-chat-profile]");

if(cp){

modules.profile.showUser(
cp.dataset.chatProfile
);

return
}

let sp=e.target.closest("[data-start-chat]");

if(sp){

NOVA.state.activeChat=
sp.dataset.startChat;

NOVA.state.chatProfile=null;

NOVA.go("messages");

return
}

let sm=e.target.closest("[data-send-message]");

if(sm){

modules.messages.send(
sm.dataset.sendMessage
);

return
}

if(e.target.closest("[data-attach-open]")){

$("attachMenu")?.classList.toggle("open");

return
}

let at=e.target.closest("[data-attach]");

if(at){

$("attachMenu")?.classList.remove("open");

let id=NOVA.state.activeChat;

if(at.dataset.attach==="photo")
modules.messages.media(id,"image");

if(at.dataset.attach==="video")
modules.messages.media(id,"video");

if(at.dataset.attach==="voice")
modules.messages.record(id);

return
}

let th=e.target.closest("[data-chat-theme]");

if(th){

modules.messages.theme(
th.dataset.chatTheme
);

return
}

let tc=e.target.closest("[data-theme-choice]");

if(tc){

modules.messages.setTheme(
tc.dataset.chatId,
tc.dataset.themeChoice
);

return
}

if(e.target.closest("[data-clear-reply]")){

NOVA.state.replyTo=null;

if(NOVA.state.activeChat)
modules.messages.chat(
NOVA.state.activeChat
);

return
}

let vp=e.target.closest("[data-voice-play]");

if(vp){

let audio=$(
"audio_"+vp.dataset.voicePlay
);

if(!audio)return;

if(audio.paused){

document.querySelectorAll("audio").forEach(a=>{
if(a!==audio)a.pause()
});

audio.play().catch(()=>{});

vp.innerHTML=ICONS.pause

}else{

audio.pause();

vp.innerHTML=ICONS.play

}

audio.onended=()=>{
vp.innerHTML=ICONS.play
};

return
}

let vl=e.target.closest("[data-voice-like]");

if(vl){

let arr=modules.db.chat(
modules.db.me().id,
NOVA.state.activeChat
);

let m=arr.find(
x=>x.id===vl.dataset.voiceLike
);

if(!m)return;

let me=modules.db.me().id;

m.voiceLiked??=[];

m.voiceLiked.includes(me)
?m.voiceLiked=m.voiceLiked.filter(x=>x!==me)
:m.voiceLiked.push(me);

modules.db.save();

modules.messages.chat(
NOVA.state.activeChat
);

return
}

let lr=e.target.closest("[data-long-react]");

if(lr){

applyMessageReaction(
lr.dataset.messageId,
lr.dataset.longReact
);

return
}

let la=e.target.closest("[data-long-action]");

if(la){

let id=la.dataset.messageId;
let x=la.dataset.longAction;

if(x==="close")
closeLong();

if(x==="delete")
deleteMessage(id);

if(x==="reply"){

NOVA.state.replyTo=id;

closeLong();

modules.messages.chat(
NOVA.state.activeChat
);

setTimeout(
()=>$("messageInput")?.focus(),
40
)

}

if(x==="play"){

let a=$("audio_"+id);

if(a)
a.play().catch(()=>{})

}

return
}

let setting=e.target.closest("[data-setting]");

if(setting){

modules.db.settings[
setting.dataset.setting
]=setting.checked;

modules.db.save();

return
}

});

$("modalBg").addEventListener("click",e=>{

if(e.target===$("modalBg"))
NOVA.closeModal()

});

$("longPressShade").addEventListener("click",e=>{

if(e.target===$("longPressShade"))
closeLong()

});

/* KEYBOARD */

document.addEventListener("keydown",e=>{

if(e.key==="Escape"){

NOVA.closeModal();
modules.stories.close();
closeLong()

}

if(
e.key==="Enter"&&
!e.shiftKey&&
e.target.id==="commentInput"
){

e.preventDefault();

modules.posts.addComment(
e.target
.closest(".chatInput")
?.querySelector("[data-comment]")
?.dataset.comment
)

}

if(
e.key==="Enter"&&
!e.shiftKey&&
e.target.id==="messageInput"
){

e.preventDefault();

if(NOVA.state.activeChat)
modules.messages.send(
NOVA.state.activeChat
)

}

if(
e.key==="Enter"&&
!e.shiftKey&&
e.target.id==="storyReplyInput"
){

e.preventDefault();

modules.stories.reply()

}

});

/* LONG PRESS + SWIPE REPLY */

document.addEventListener("pointerdown",e=>{

let b=e.target.closest("[data-message]");

if(!b||e.button!==0)return;

let id=b.dataset.message;

let startX=e.clientX;
let moved=false;

NOVA.state.pressTimer=setTimeout(()=>{

if(!moved)
openLongPress(id)

},520);

let move=ev=>{

if(Math.abs(ev.clientX-startX)>35){

moved=true;

clearTimeout(
NOVA.state.pressTimer
);

let dx=Math.max(
0,
Math.min(80,ev.clientX-startX)
);

if(dx>8)
b.style.transform=
`translateX(${dx}px)`;

if(dx>=60){

NOVA.state.replyTo=id;

clearTimeout(
NOVA.state.pressTimer
);

}

}

};

let up=()=>{

clearTimeout(
NOVA.state.pressTimer
);

let dx=e.clientX-startX;

b.style.transform="";

document.removeEventListener(
"pointermove",
move
);

document.removeEventListener(
"pointerup",
up
);

if(dx>=60){

modules.messages.chat(
NOVA.state.activeChat
);

setTimeout(
()=>$("messageInput")?.focus(),
40
)

}

};

document.addEventListener(
"pointermove",
move,
{passive:true}
);

document.addEventListener(
"pointerup",
up,
{once:true}
);

});

/* VOICE PRESS */

document.addEventListener("pointerdown",e=>{

let btn=e.target.closest("[data-record]");

if(!btn)return;

if(!NOVA.state.activeChat)return;

NOVA.state.voicePress=true;

NOVA.state.voiceTimer=setTimeout(()=>{

if(NOVA.state.voicePress)
modules.messages.record(
NOVA.state.activeChat
)

},280)

});

document.addEventListener("pointerup",e=>{

if(!NOVA.state.voicePress)return;

NOVA.state.voicePress=false;

clearTimeout(
NOVA.state.voiceTimer
);

if(NOVA.recording)
modules.messages.stopRecord()

});

/* STORY SWIPE */

let storyTouchStart=0;

$("viewer").addEventListener(
"touchstart",
e=>{
storyTouchStart=
e.changedTouches[0].clientX
},
{passive:true}
);

$("viewer").addEventListener(
"touchend",
e=>{

let dx=
e.changedTouches[0].clientX-
storyTouchStart;

if(Math.abs(dx)>80){

if(dx<0)
modules.stories.next();
else
modules.stories.prev()

}

},
{passive:true}
);

/* VISIBILITY */

document.addEventListener("visibilitychange",()=>{

if(document.hidden){

let v=$("storyVideo");

if(v)
v.pause();

document.querySelectorAll("audio")
.forEach(a=>a.pause())

}
});

/* APP BOOT */

modules.db.init();

if(
auth.session&&
modules.db.user(auth.session.userId)
){

let u=modules.db.user(
auth.session.userId
);

u.online=true;

modules.db.save();

auth.hide();

NOVA.go("home")

}else{

auth.show();
auth.render("login")

}

/* KEEP LOCAL USERS ONLINE */

setInterval(()=>{

let me=modules.db.me();

if(me){

me.online=true;

modules.db.users.forEach(u=>{

if(
u.id!==me.id&&
u.online===undefined
)
u.online=true

});

modules.db.save()

}

},15000);

/* STOP MEDIA */

window.addEventListener("beforeunload",()=>{

try{

let v=$("storyVideo");

if(v)
v.pause();

document.querySelectorAll("audio")
.forEach(a=>a.pause());

let u=modules.db.me();

if(u){
u.online=false;
modules.db.save()
}

}catch(e){}

});

/* iOS keyboard: keep composer visible */
window.visualViewport?.addEventListener("resize",()=>{

if(!document.body.classList.contains("chat-open"))
return;

let chat=document.querySelector(".chat");

if(!chat)return;

requestAnimationFrame(()=>{
let input=$("messageInput");

if(
document.activeElement===input
){
setTimeout(()=>{
let box=$("chatMessages");
if(box)box.scrollTop=box.scrollHeight
},80)
}
})

});
</script>
</body>
</html>
