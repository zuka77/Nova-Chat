<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NOVA Social</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#07070b;--card:#101018;--card2:#171720;--card3:#1d1d27;
--text:#fff;--muted:#8d8d9b;--line:rgba(255,255,255,.08);
--p:#8b5cf6;--pink:#ec4899;--red:#ff416c;--green:#35d07f
}
html,body{
background:var(--bg);color:var(--text);min-height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
-webkit-tap-highlight-color:transparent
}
body{padding-bottom:78px;overflow-x:hidden}
body.chat-open{padding-bottom:0;overflow:hidden}
button,input,textarea{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
input,textarea{
width:100%;background:var(--card2);color:var(--text);
border:1px solid var(--line);border-radius:15px;padding:13px;outline:none
}
input:focus,textarea:focus{border-color:#8b5cf666}
.app{max-width:680px;margin:auto}
.top{
height:64px;position:sticky;top:0;z-index:30;
background:rgba(7,7,11,.88);backdrop-filter:blur(20px);
border-bottom:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;padding:0 15px
}
body.chat-open .top{display:none}
.logo{
font-size:27px;font-weight:950;letter-spacing:-1px;
background:linear-gradient(90deg,var(--p),var(--pink));
-webkit-background-clip:text;color:transparent
}
.topBtns{display:flex;gap:7px}
.circle{
width:40px;height:40px;border-radius:50%;background:var(--card2);
display:grid;place-items:center;flex:none
}
.svg{width:20px;height:20px;display:block}
.circle .svg{width:19px;height:19px}
.notifBtn{position:relative}
.notifBadge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#ff2d55;color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg);line-height:1}
.notifBadge:empty{display:none}
.typingStatus{height:18px;padding:0 16px;color:var(--muted);font-size:12px;font-weight:700;opacity:.95}
.profileAvatarStory{display:inline-grid;padding:4px;border-radius:50%}.profileAvatarStory.hasStory{background:linear-gradient(135deg,var(--p),var(--pink),#ffb300)}.profileAvatarStory .avatar.big{width:92px;height:92px;border:3px solid var(--bg)}
.notificationList{display:flex;flex-direction:column;gap:8px}.notificationRow{width:100%;display:flex;align-items:center;gap:11px;padding:12px;border-radius:16px;background:var(--card2);text-align:left}.notificationRow:active{transform:scale(.99)}.notificationBody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.notificationBody b{font-size:14px}.notificationBody span{font-size:11px;color:var(--muted)}.notificationArrow{font-size:24px;color:var(--muted)}
.screen{display:none;padding:13px}
.screen.active{display:block;animation:screenIn .22s ease}
@keyframes screenIn{
from{opacity:0;transform:translateY(7px)}
to{opacity:1;transform:none}
}
.title{font-size:27px;font-weight:900;margin:10px 3px 16px}
.card{
background:var(--card);border:1px solid var(--line);
border-radius:21px;margin-bottom:13px;overflow:hidden
}
.row{display:flex;align-items:center;gap:10px}
.avatar{
width:43px;height:43px;border-radius:50%;overflow:hidden;
display:grid;place-items:center;flex:none;
background:linear-gradient(135deg,var(--p),var(--pink));font-weight:900
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:36px;height:36px}
.avatar.big{width:92px;height:92px}
.avatar.online{
box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--green)
}
.createBar{display:flex;align-items:center;gap:9px;padding:12px}
.fakeInput{
flex:1;background:var(--card2);border-radius:18px;padding:12px;
color:var(--muted);text-align:left
}
.stories{
display:flex;gap:12px;overflow:auto;padding:4px 2px 16px;
scrollbar-width:none
}
.stories::-webkit-scrollbar{display:none}
.story{
min-width:68px;width:68px;text-align:center;color:var(--muted);font-size:10px
}
.storyRing{
width:64px;height:64px;border-radius:50%;padding:2px;margin:auto auto 5px;
background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b)
}
.storyInner{
width:100%;height:100%;border-radius:50%;background:var(--card2);
overflow:hidden;display:grid;place-items:center;font-size:25px
}
.storyInner img,.storyInner video{
width:100%;height:100%;object-fit:cover
}
.postHead{
display:flex;align-items:center;gap:10px;padding:13px
}
.userInfo{flex:1;min-width:0}
.name{font-weight:800;font-size:14px}
.handle,.time{font-size:11px;color:var(--muted)}
.postText{
padding:0 14px 13px;line-height:1.5;font-size:15px;
white-space:pre-wrap;overflow-wrap:anywhere
}
.media{
width:100%;max-height:620px;object-fit:cover;
background:#000;display:block
}
.actions{
display:flex;gap:3px;padding:8px;
border-top:1px solid var(--line);overflow:auto
}
.action{
min-width:42px;padding:9px;border-radius:12px;
color:var(--muted);display:flex;align-items:center;
justify-content:center;gap:4px
}
.action svg{width:18px;height:18px}
.action.active{
color:#ff3d72;background:rgba(255,61,114,.1)
}
.meta{font-size:11px;color:var(--muted);padding:0 14px 12px}
.commentPreview{padding:0 14px 14px;font-size:13px}
.btn{
background:linear-gradient(135deg,var(--p),var(--pink));
color:#fff;border-radius:14px;padding:11px 16px;font-weight:800
}
.btn.secondary{background:var(--card2)}
.btn.small{padding:8px 12px;font-size:12px}
.full{width:100%}
.search{margin-bottom:13px;position:relative}
.search input{padding-left:42px}
.searchIcon{
position:absolute;left:14px;top:12px;color:var(--muted)
}
.people{
display:flex;align-items:center;gap:10px;padding:13px;
border-bottom:1px solid var(--line)
}
.people:last-child{border-bottom:0}
.tabs{
display:flex;background:var(--card2);padding:4px;
border-radius:14px;margin-bottom:13px
}
.tab{
flex:1;padding:10px;color:var(--muted);border-radius:11px
}
.tab.active{background:var(--card);color:#fff;font-weight:800}
.profile{text-align:center;padding:18px}
.profile .avatar{margin:auto}
.profileName{font-size:24px;font-weight:900;margin-top:9px}
.bio{color:var(--muted);font-size:13px;margin:6px auto 15px}
.stats{display:flex;justify-content:center;gap:35px;margin:15px}
.stat b{display:block;font-size:19px}
.stat span{font-size:11px;color:var(--muted)}
.option{
display:flex;align-items:center;gap:12px;padding:14px;
border-bottom:1px solid var(--line)
}
.option:last-child{border-bottom:0}
.icon{width:28px;text-align:center}
.icon svg{width:20px;height:20px}
.optionMain{flex:1}
.optionMain b{display:block;font-size:14px}
.optionMain span{display:block;color:var(--muted);font-size:11px}
.bottom{
position:fixed;bottom:0;left:0;right:0;height:75px;z-index:50;
background:rgba(12,12,17,.94);backdrop-filter:blur(20px);
border-top:1px solid var(--line)
}
body.chat-open .bottom,
body.chat-open .fab{display:none}
.bottomIn{
max-width:680px;margin:auto;height:100%;
display:flex;justify-content:space-around
}
.nav{
width:58px;height:58px;margin-top:7px;border-radius:17px;
color:var(--muted);display:flex;flex-direction:column;
align-items:center;justify-content:center
}
.nav span{font-size:9px}
.nav.active{background:var(--card2);color:#fff}
.fab{
position:fixed;right:20px;bottom:90px;z-index:40;
width:56px;height:56px;border-radius:50%;
background:linear-gradient(135deg,var(--p),var(--pink));
color:#fff;font-size:28px;box-shadow:0 10px 35px #8b5cf655
}
.modalBg{
position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);
backdrop-filter:blur(8px);display:none;align-items:flex-end
}
.modalBg.open{display:flex}
.modal{
width:min(680px,100%);max-height:92vh;overflow:auto;
background:var(--card);border-radius:27px 27px 0 0;
padding:17px;animation:modalUp .22s ease
}
@keyframes modalUp{
from{transform:translateY(100%)}to{transform:none}
}
.modalHead{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:15px
}
.modalTitle{font-size:19px;font-weight:900}
.close{
width:38px;height:38px;border-radius:50%;
background:var(--card2);font-size:22px
}
.form{display:grid;gap:11px}
.preview{
width:100%;max-height:380px;object-fit:contain;border-radius:17px;
display:none;background:#000
}
.reactions{display:flex;flex-wrap:wrap;gap:7px}
.react{
width:48px;height:48px;border-radius:14px;
background:var(--card2);display:grid;place-items:center
}
.react svg{width:24px;height:24px}
.react.active{
background:rgba(139,92,246,.22);
box-shadow:0 0 0 1px #8b5cf666
}
.comments{max-height:45vh;overflow:auto}
.comment{
display:flex;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)
}
.commentBody{flex:1;font-size:13px}
.commentTime{font-size:10px;color:var(--muted)}

.chatListTitle{
display:flex;justify-content:space-between;align-items:center
}
.chatRow{
width:100%;display:flex;gap:10px;padding:14px;
border-bottom:1px solid var(--line);text-align:left;transition:.18s
}
.chatRow:active{background:var(--card2)}
.chatMain{flex:1;min-width:0}
.chatMain b{font-size:14px}
.chatMain div{
font-size:12px;color:var(--muted);white-space:nowrap;
overflow:hidden;text-overflow:ellipsis
}

/* =========================================================
   FULLSCREEN MOBILE CHAT
   ========================================================= */

body.chat-open #messages{
display:block;
padding:0;
margin:0;
width:100%;
height:100dvh;
min-height:100dvh;
animation:none;
}

.chat{
position:fixed;
inset:0;
z-index:80;
width:100%;
height:100dvh;
min-height:100dvh;
display:flex;
flex-direction:column;
background:var(--bg);
overflow:hidden;
padding-bottom:env(safe-area-inset-bottom);
}

.chatHead{
height:62px;
min-height:62px;
padding:7px 9px;
border-bottom:1px solid var(--line);
background:rgba(7,7,11,.94);
backdrop-filter:blur(22px);
display:flex;
align-items:center;
gap:4px;
z-index:5;
}

.chatHead .circle{
width:42px;
height:42px;
background:transparent
}

.chatHead .row[data-chat-profile]{
height:48px;
min-width:0;
padding:2px 5px;
border-radius:14px
}

.chatHead .row[data-chat-profile]:active{
background:var(--card2)
}

.chatHead .row[data-chat-profile] .avatar{
width:37px;
height:37px
}

.chatHead .row[data-chat-profile]>div:last-child{
min-width:0;
overflow:hidden
}

.chatHead .row[data-chat-profile] b{
display:block;
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.chatMessages{
flex:1;
min-height:0;
overflow-y:auto;
overflow-x:hidden;
-webkit-overflow-scrolling:touch;
overscroll-behavior:contain;
padding:14px 13px 12px;
scroll-behavior:smooth;
background-size:cover;
background-position:center;
border-radius:0;
}

.chatMessages.theme-dark{
background:linear-gradient(135deg,#090910,#141421)
}
.chatMessages.theme-purple{
background:linear-gradient(135deg,#161023,#251338)
}
.chatMessages.theme-blue{
background:linear-gradient(135deg,#07121c,#102637)
}
.chatMessages.theme-light{
background:linear-gradient(135deg,#edf1f7,#dce2ec)
}
.chatMessages.hasBg{
background-color:#08080c
}

/* message row */
.bubbleWrap{
position:relative;
margin:3px 0;
display:flex;
flex-direction:column;
transition:transform .18s ease;
width:100%;
touch-action:pan-y
}
.bubbleWrap.me{align-items:flex-end}
.bubbleWrap.them{align-items:flex-start}

/* TEXT BUBBLES ONLY */
.bubble{
position:relative;
max-width:min(78%,330px);
padding:8px 11px;
border-radius:18px;
font-size:14px;
line-height:1.4;
word-break:break-word;
transition:transform .18s,opacity .18s;
}

.bubble.me{
background:linear-gradient(135deg,var(--p),var(--pink));
border-bottom-right-radius:5px
}
.bubble.them{
background:var(--card2);
border-bottom-left-radius:5px
}
.bubble.deleted{
font-style:italic;
opacity:.55
}

/* IMPORTANT:
   PHOTO / VIDEO HAVE NO MESSAGE BUBBLE */
.mediaMessage{
position:relative;
display:flex;
flex-direction:column;
align-items:flex-start;
max-width:82%;
padding:0;
margin:0;
background:transparent;
border:0;
box-shadow:none
}
.bubbleWrap.me .mediaMessage{
align-items:flex-end
}

.chatMedia{
display:block;
width:auto;
max-width:min(300px,78vw);
max-height:min(430px,58vh);
object-fit:cover;
background:#000;
border-radius:17px;
padding:0;
margin:0;
box-shadow:0 2px 18px rgba(0,0,0,.18)
}

.chatMediaVideo{
display:block;
width:auto;
max-width:min(300px,78vw);
max-height:min(430px,58vh);
object-fit:contain;
background:#000;
border-radius:17px;
padding:0;
margin:0
}

/* media timestamp stays outside media */
.mediaTime{
font-size:8px;
color:#ffffff99;
margin-top:4px;
padding:0 4px;
line-height:1
}
.bubbleWrap.them .mediaTime{
color:#ffffff77
}

.msgTime{
font-size:8px;
opacity:.55;
text-align:right;
margin-top:3px
}

/* reaction no longer covers photo/video */
.msgReaction{
position:relative;
bottom:auto;
right:auto;
align-self:flex-end;
margin-top:3px;
background:var(--card);
border:1px solid var(--line);
border-radius:10px;
padding:3px 5px;
display:flex;
align-items:center;
gap:2px;
z-index:2;
box-shadow:0 3px 12px #0005
}
.bubbleWrap.them .msgReaction{
align-self:flex-start
}
.msgReaction svg{width:13px;height:13px}

.replyQuote{
font-size:10px;
padding:5px 7px;
border-left:2px solid #ffffff77;
margin-bottom:5px;
opacity:.72;
background:#00000018;
border-radius:5px;
max-width:100%
}

/* voice stays compact */
.voice{
display:flex;
align-items:center;
gap:8px;
min-width:190px
}
.voicePlay{
width:36px;height:36px;border-radius:50%;
background:#ffffff1d;display:grid;place-items:center
}
.voicePlay svg{width:16px;height:16px}
.wave{
display:flex;gap:2px;align-items:center;
height:26px;flex:1
}
.wave i{
display:block;width:3px;border-radius:3px;
background:#fff;opacity:.7
}
.voiceLike{
width:30px;height:30px;display:grid;place-items:center
}
.voiceLike svg{width:16px;height:16px}
.voiceLike.active{color:#ff4778}
.voiceTime{font-size:9px;opacity:.6}

.chatInputArea{
background:rgba(7,7,11,.96);
backdrop-filter:blur(20px);
border-top:1px solid var(--line);
padding:7px 9px calc(8px + env(safe-area-inset-bottom));
z-index:6;
flex:none
}

.chatInput{
display:flex;
gap:6px;
align-items:center;
width:100%;
padding:0
}

.chatInput input{
flex:1;
min-width:0;
height:43px;
padding:10px 13px;
border-radius:21px;
background:var(--card2);
border:1px solid var(--line)
}

.iconBtn{
width:42px;
height:42px;
border-radius:50%;
background:var(--card2);
display:grid;
place-items:center;
flex:none
}
.iconBtn:active{transform:scale(.94)}
.iconBtn svg{width:19px;height:19px}

.recording{
background:#24131c!important;
color:#ff5c83!important;
animation:pulse 1s infinite
}
@keyframes pulse{
50%{box-shadow:0 0 0 7px #ff416c18}
}

.replyBar{
display:none;
background:var(--card2);
border-radius:13px;
padding:8px 10px;
margin:0 0 7px;
align-items:center;
gap:8px
}
.replyBar.open{
display:flex;
animation:replyIn .18s ease
}
@keyframes replyIn{
from{opacity:0;transform:translateY(6px)}
to{opacity:1;transform:none}
}
.replyBarText{
flex:1;
font-size:11px;
color:var(--muted);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}
.replyClose{font-size:18px;color:var(--muted)}

.attachMenu{
display:none;
position:absolute;
bottom:52px;
left:0;
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:7px;
z-index:20;
box-shadow:0 15px 40px #0008
}
.attachMenu.open{display:grid}
.attachItem{
padding:11px 13px;
border-radius:12px;
display:flex;
gap:8px;
align-items:center;
white-space:nowrap
}
.attachItem:active{background:var(--card2)}
.chatInputWrap{position:relative;flex:none}

.chatProfileHeader{
padding:20px;text-align:center;background:var(--card);
border-radius:20px;margin-bottom:12px
}
.chatProfileHeader .avatar{margin:auto}
.profileGrid{
display:grid;grid-template-columns:repeat(3,1fr);gap:2px
}
.profileGrid img,.profileGrid video{
width:100%;aspect-ratio:1;object-fit:cover;background:#000
}
.empty{
text-align:center;color:var(--muted);padding:50px 20px
}
.empty b{display:block;color:#fff;margin-bottom:5px}
.toast{
position:fixed;z-index:300;bottom:95px;left:50%;
transform:translate(-50%,20px);opacity:0;background:#25252e;color:#fff;
padding:12px 17px;border-radius:15px;transition:.25s;
pointer-events:none;max-width:90%;text-align:center
}
.toast.show{
opacity:1;transform:translate(-50%,0)
}
.viewer{
position:fixed;inset:0;z-index:200;background:#000;
display:none;color:#fff
}
.viewer.open{display:block}
.viewerIn{
height:100%;max-width:520px;margin:auto;
position:relative;overflow:hidden
}
.viewerMedia{
width:100%;height:100%;object-fit:contain;background:#000
}
.viewerText{
width:100%;height:100%;display:grid;place-items:center;
text-align:center;padding:40px;font-size:34px;font-weight:900;
background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b)
}
.viewerTop{
position:absolute;top:13px;left:12px;right:12px;z-index:8
}
.progress{
height:3px;background:#ffffff55;border-radius:10px
}
.viewerClose{
position:absolute;right:12px;top:18px;
z-index:20;font-size:30px
}
.viewerNav{
position:absolute;inset:0;display:flex;z-index:5
}
.viewerSide{flex:1}
.viewerBottom{
position:absolute;bottom:17px;left:12px;right:12px;
z-index:10;display:flex;gap:6px
}
.viewerBottom input{
background:#111c;border-color:#ffffff22;color:#fff
}
.viewerBtn{
width:45px;height:45px;border-radius:50%;
background:#ffffff22;color:#fff;display:grid;place-items:center
}
.viewerBtn svg{width:19px;height:19px}
.storyReactRow{
display:flex;gap:5px;overflow:auto;
position:absolute;bottom:72px;left:12px;right:12px;z-index:10
}
.storyReactRow button{
min-width:42px;height:42px;background:#ffffff1c;
border-radius:13px;display:grid;place-items:center
}
.storyReactRow button.active{
background:#ffffff35;
box-shadow:0 0 0 1px #ffffff55
}
.storyReactRow svg{width:21px;height:21px}
.storyReplies{
position:absolute;left:12px;right:12px;bottom:125px;
max-height:28vh;overflow:auto;z-index:9
}
.storyReply{
background:#111d;padding:9px 11px;
border-radius:14px;margin:5px 0;font-size:12px
}
.longPressShade{
position:fixed;inset:0;z-index:500;
background:rgba(0,0,0,.48);
backdrop-filter:blur(13px);
display:none;align-items:flex-end
}
.longPressShade.open{display:flex}
.longMenu{
width:min(680px,100%);
background:rgba(25,25,34,.97);
border-radius:28px 28px 0 0;
padding:12px;animation:modalUp .18s ease
}
.longPreview{
background:var(--card);border-radius:17px;
padding:5px;margin-bottom:8px;
max-height:180px;overflow:hidden
}
.longActions{display:grid;gap:4px}
.longAction{
padding:15px;border-radius:14px;text-align:left;
background:transparent;display:flex;gap:12px;align-items:center
}
.longAction svg{width:20px;height:20px}
.longAction:active{background:var(--card2)}
.reactRow{
display:flex;gap:4px;background:var(--card);
border:1px solid var(--line);border-radius:20px;
padding:7px;margin-bottom:8px;overflow:auto
}
.reactChoice{
min-width:42px;height:42px;border-radius:14px;
background:var(--card2);display:grid;place-items:center
}
.reactChoice svg{width:20px;height:20px}
.auth{
position:fixed;inset:0;z-index:1000;
background:radial-gradient(circle at top right,#321657,#08080d 45%);
display:none;overflow:auto
}
.authWrap{
min-height:100%;width:min(440px,100%);margin:auto;

justify-content:center
}
.authLogo{
text-align:center;font-size:52px;font-weight:950;

.authCard{

.authTabs{

.hidden{display:none!important}

right:auto;

window.NOVA_UPLOAD_TO_CLOUDINARY = async function(file, options = {}) {
  if (!file) throw new Error("No file selected");

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", window.NOVA_CLOUDINARY.uploadPreset);

  if (options.folder) formData.append("folder", options.folder);
  if (options.publicId) formData.append("public_id", options.publicId);

  const response = await fetch(window.NOVA_CLOUDINARY.uploadUrl, {
    method: "POST",
    body: formData
  });

  const data = await response.json();
  if (!response.ok || data.error) {
    throw new Error(data?.error?.message || "Cloudinary upload failed");
  }

  return data;
};

uid(p="id"){
return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9)
},

esc(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
},

time(t){
let n=Date.now()-Number(t);
if(n<60000)return"now";
if(n<3600000)return Math.floor(n/60000)+"m";
if(n<86400000)return Math.floor(n/3600000)+"h";
if(n<604800000)return Math.floor(n/86400000)+"d";
return new Date(Number(t)).toLocaleDateString()
},

get(k,d){
try{
let x=localStorage.getItem("NOVA_"+k);
return x?JSON.parse(x):d
}catch(e){return d}

set(k,v){
try{localStorage.setItem("NOVA_"+k,JSON.stringify(v))}
catch(e){}

toast(t){
let x=$("toast");
if(!x)return;
x.textContent=t;
x.classList.add("show");
clearTimeout(this.toastT);
this.toastT=setTimeout(()=>x.classList.remove("show"),2200)
},

modal(t,h){

x.classList.toggle("active",x.dataset.go===s)

async image(file){
return new Promise(resolve=>{
if(!file)return resolve("");
let r=new FileReader;
r.onload=()=>resolve(r.result);
r.onerror=()=>resolve("");
r.readAsDataURL(file)
} )
},

async hashText(v){
if(window.crypto?.subtle){
let b=await crypto.subtle.digest(
"SHA-256",new TextEncoder().encode(v)
);
return [...new Uint8Array(b)]
.map(x=>x.toString(16).padStart(2,"0")).join("")
}
let h=0;
for(let i=0;i<v.length;i++)
h=((h<<5)-h)+v.charCodeAt(i)|0;
return String(h)
}
};

modules.db={
users:[],
posts:[],
stories:[],
messages:[],
notifications:[],
settings:{
notifications:true,
online:true,
autoplay:true,
theme:"dark"
},
chats:{},

init(){
  this.users=[];
  this.posts=[];
  this.stories=[];
  this.messages=[];
  this.notifications=[];
  this.settings={notifications:true,online:true,autoplay:true,theme:"dark"};
  this.chats={};
},

isOwner(id){
  const target=String(id||this.me()?.id||"");
  const fu=window.NOVA_FIREBASE?.auth?.currentUser;
  if(!fu)return false;
  const mapped=window.NOVA_OWNER_UID||"";
  const me=this.user(target)||this.user(fu.uid);
  return !!(
    (mapped && target===mapped && fu.uid===mapped) ||
    (target===fu.uid && me?.owner===true)
  );
},

setVerified(id,value){
if(!this.isOwner())return false;
let u=this.user(id);
if(!u||u.id===window.NOVA_OWNER_UID)return false;
u.verified=!!value;
this.save();
return true
},

save(){
[
"users","posts","stories","messages",
"notifications","settings","chats"
].forEach(k=>NOVA.set(k,this[k]))
},

me(){
return this.user(auth.session?.userId||"me")
},

user(id){
return this.users.find(x=>x.id===id)
},

post(id){
return this.posts.find(x=>x.id===id)
},

allPostComments(id){
  const out=[];
  (Array.isArray(this.users)?this.users:[]).forEach(u=>(u.postComments||[]).forEach(c=>{if(c.postId===id)out.push(c)}));
  const p=this.post(id);
  (p?.comments||[]).forEach(c=>{if(!out.some(x=>x.id===c.id))out.push(c)});
  return out.sort((a,b)=>a.time-b.time);
},

following(id){
return(this.me()?.followingUsers||[]).includes(id)
},

followingList(id){
const u=this.user(id||this.me()?.id);
return (u?.followingUsers||[]).map(x=>this.user(x)).filter(Boolean);
},

followerList(id){
const target=String(id||this.me()?.id);
return (Array.isArray(this.users)?this.users:[]).filter(u=>(u.followingUsers||[]).includes(target));
},

followerCount(id){return this.followerList(id).length},

follow(id){
let m=this.me(),u=this.user(id);
if(!u||!m||id===m.id)return;
m.followingUsers=Array.isArray(m.followingUsers)?m.followingUsers:[];
if(!m.followingUsers.includes(id))m.followingUsers.push(id);
this.save();
this.saveUserCloud(m.id,{followingUsers:m.followingUsers});
},

unfollow(id){
let m=this.me();
if(!m)return;
m.followingUsers=(m.followingUsers||[]).filter(x=>x!==id);
this.save();
this.saveUserCloud(m.id,{followingUsers:m.followingUsers});
},

updateNotificationBadge(){
const el=$("notifBadge");
if(!el)return;
const n=(Array.isArray(this.notifications)?this.notifications:[]).filter(x=>!x.read).length;
const me=this.me()?.id;
const chatUnread=me?Object.values(this.chats||{}).reduce((sum,arr)=>sum+(Array.isArray(arr)?arr.filter(m=>m.from!==me&&!m.read).length:0),0):0;
const total=n+chatUnread;
el.textContent=total>99?"99+":String(total||"");
},

notify(type,user,text,extra={}){
if(!this.settings.notifications)return;

this.notifications.unshift({
id:NOVA.uid("notif"),
type,
user,
text,
time:Date.now(),
read:false,
...extra
});

this.notifications=this.notifications.slice(0,100);
this.updateNotificationBadge();
this.save();
},

chatKey(a,b){
return[a,b].sort().join("__")
},

chat(a,b){

let k=this.chatKey(a,b);

if(!this.chats[k]){
this.chats[k]=[];
}

if(!Array.isArray(this.chats[k])){
this.chats[k]=this.chats[k].messages||[];
}

this.chats[k].forEach(m=>{
m.reactionBy??={}
});

return this.chats[k]
},

saveUserCloud(uid,patch){
  if(!uid||!fAuth.currentUser||fAuth.currentUser.uid!==uid)return Promise.resolve(false);
  return userDoc(uid).set(clean(patch),{merge:true}).then(()=>true).catch(err=>{
    console.error("NOVA user cloud save failed:",err);
    NOVA.toast("Cloud save failed: "+(err?.message||"Firebase error"));
    return false;
  });
},

notifyUserCloud(recipient,type,actor,text,extra={}){
  if(!recipient||!fAuth.currentUser)return Promise.resolve(false);
  const item={id:NOVA.uid("notif"),type,user:actor,recipient,text,time:Date.now(),read:false,...extra};
  const FV=window.firebase?.firestore?.FieldValue;
  if(!FV)return Promise.resolve(false);
  return notifDoc(recipient).set({items:FV.arrayUnion(item),updated:Date.now()},{merge:true}).then(()=>true).catch(err=>{
    console.error("NOVA notification cloud failed:",err);
    return false;
  });
},

saveChatCloud(key){
  if(!fAuth.currentUser||!key)return Promise.resolve(false);
  const parts=String(key).split("__");
  if(parts.length!==2||!parts.includes(fAuth.currentUser.uid))return Promise.resolve(false);
  return fdb.collection("chats").doc(key).set({
    participants:parts,
    messages:Array.isArray(this.chats[key])?this.chats[key].map(m=>clean(m)):[],
    updated:Date.now()
  },{merge:true}).then(()=>true).catch(err=>{
    console.error("NOVA chat cloud save failed:",err);
    NOVA.toast("Chat save failed: "+(err?.message||"Firebase error"));
    return false;
  });
},

sendMessage(to,obj){

let me=this.me()?.id;

if(!me||!to)return null;

let arr=this.chat(me,to);

let msg={
id:NOVA.uid("msg"),
from:me,
to,
time:Date.now(),
kind:"text",
text:"",
replyTo:null,
reactionBy:{},
...obj
};

msg.read=false;
arr.push(msg);

const key=this.chatKey(me,to);
this.saveChatCloud(key);
this.notifyUserCloud(to,"message",me,"sent you a message",{chat:me,messageId:msg.id});
this.updateNotificationBadge();
return msg
}
};

async deleteAllChats(){
if(!modules.db.isOwner())return NOVA.toast("Owner only");
if(!confirm("Delete ALL chats for ALL users? This cannot be undone."))return;

try{
const fb=window.NOVA_FIREBASE?.db;
if(!fb)throw new Error("Firebase Firestore is not available");
const snap=await fb.collection("chats").get();
if(!snap.size){
NOVA.toast("There are no chats to delete");
return;
}

let batch=fb.batch();
let count=0;
for(const doc of snap.docs){
batch.delete(doc.ref);
count++;
if(count===450){
await batch.commit();
 batch=fb.batch();
 count=0;
}
}
if(count)await batch.commit();

modules.db.chats={};
modules.db.updateNotificationBadge();
NOVA.state.activeChat=null;
NOVA.state.chatProfile=null;
document.body.classList.remove("chat-open");
NOVA.closeModal();
NOVA.render("messages");
NOVA.toast("All chats deleted for everyone ✓");
}catch(e){
console.error(e);
const msg=e?.code==="permission-denied"?"Owner cloud access is not linked to this Firebase account yet.":(e?.message||"Firebase error");
NOVA.toast("Could not delete all chats: "+msg);
}
}
};

async record(id){
if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return NOVA.toast("Voice recording is not supported in this browser");
if(NOVA.recording)return;
try{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
const chunks=[];
let mime="";
if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus"))mime="audio/webm;codecs=opus";
else if(MediaRecorder.isTypeSupported("audio/webm"))mime="audio/webm";
const rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
NOVA.recording=rec; NOVA.recordingStarted=Date.now();
const btn=$("voiceBtn"); btn?.classList.add("recording");
rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
rec.onstop=async()=>{
stream.getTracks().forEach(t=>t.stop());
const duration=Math.max(1,Math.round((Date.now()-NOVA.recordingStarted)/1000));
const blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});
try{
const audioFile=new File([blob],`voice-${Date.now()}.webm`,{type:blob.type||"audio/webm"});
const data=await uploadFile(audioFile,`nova/chats/${modules.db.me().id}`);
if(!data)throw new Error("Voice upload failed");
const msg=modules.db.sendMessage(id,{kind:"voice",data,duration,voiceLiked:[]});
NOVA.recording=null; btn?.classList.remove("recording");
if(msg){ this.chat(id); NOVA.toast("Voice sent") }
}catch(err){NOVA.recording=null;btn?.classList.remove("recording");NOVA.toast("Voice upload failed")}
};
rec.start();
NOVA.toast("Recording… release to send");
}catch(e){NOVA.recording=null;$("voiceBtn")?.classList.remove("recording");NOVA.toast("Microphone permission is needed")}

/* =========================================================
   NOVA ONLINE BACKEND
   Keeps the existing NOVA UI/modules and replaces only the
   local demo storage/auth with Firebase + Cloudinary.
   ========================================================= */
(function(){
  const F=window.NOVA_FIREBASE;
  if(!F||!F.auth||!F.db){
    console.error("NOVA Firebase is not available.");
    return;
  }

  const fAuth=F.auth, fdb=F.db;
  window.NOVA_ONLINE_READY=false;
  window.NOVA_ONLINE_ERROR="";

  const clean=o=>{
    const x={...(o||{})};
    delete x.__docId;
    return x;
  };

  const userDoc=uid=>fdb.collection("users").doc(uid);
  const notifDoc=uid=>fdb.collection("notifications").doc(uid);
  const settingsDoc=uid=>fdb.collection("settings").doc(uid);
  const chatDoc=(a,b)=>fdb.collection("chats").doc([a,b].sort().join("__"));

  async function uploadFile(file,folder){
    if(!file)return "";
    const data=await NOVA_UPLOAD_TO_CLOUDINARY(file,{folder});
    return data.secure_url||data.url||"";
  }

  async function ensureProfile(fu, fallback={}){
    if(!fu) return null;
    const ref=userDoc(fu.uid);
    const snap=await ref.get();
    if(snap.exists) return {id:fu.uid,...snap.data()};

    const name=(fallback.name||fu.displayName||"NOVA User").trim();
    const handle=fallback.handle||("@"+name.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,14)+Math.floor(Math.random()*90+10));
    const profile={
      id:fu.uid,
      name:name||"NOVA User",
      handle:handle.startsWith("@")?handle:"@"+handle,
      bio:fallback.bio||"New on NOVA 🚀",
      avatar:fallback.avatar||"",
      followers:0,
      following:0,
      followingUsers:[],
      online:true,
      verified:false,
      created:Date.now()
    };
    await ref.set(clean(profile),{merge:true});
    return profile;
  }

  modules.db.init=async function(){
    this.users=[];
    this.posts=[];
    this.stories=[];
    this.messages=[];
    this.notifications=[];
    this.settings={
      notifications:true,
      online:true,
      autoplay:true,
      theme:"dark"
    };
    this.chats={};
    this.chatMeta={};

    const [us,ps,ss]=await Promise.all([
      fdb.collection("users").get(),
      fdb.collection("posts").get(),
      fdb.collection("stories").get()
    ]);

    this.users=us.docs.map(d=>({id:d.id,...d.data()}));
    try{
      const ownerSnap=await fdb.collection("config").doc("owner").get();
      window.NOVA_OWNER_UID=ownerSnap.exists?(ownerSnap.data().ownerUid||""):"";
    }catch(e){window.NOVA_OWNER_UID="";}
    this.posts=ps.docs.map(d=>({__docId:d.id,...d.data()}));
    this.stories=ss.docs.map(d=>({__docId:d.id,...d.data()}));

    this.posts.forEach(p=>{
      p.likes??=[];
      p.comments??=[];
      p.reactions??={};
      p.savedBy??=[];
      p.reposts??=0;
    });
    this.stories.forEach(s=>{
      s.reactions??={};
      s.replies??=[];
    });

        const fu=fAuth.currentUser;
    if(fu){
      await ensureProfile(fu);
      await this.loadPrivate(fu.uid);
      this.startRealtime(fu.uid);
    }
    window.NOVA_ONLINE_READY=true;
  };

  modules.db.loadPrivate=async function(uid){
    const [ns,st,cs]=await Promise.all([
      notifDoc(uid).get(),
      settingsDoc(uid).get(),
      fdb.collection("chats").where("participants","array-contains",uid).get()
    ]);

    this.notifications=ns.exists?(ns.data().items||[]):[];
    this.updateNotificationBadge();
    this.settings=st.exists?{
      notifications:true,online:true,autoplay:true,theme:"dark",
      ...(st.data()||{})
    }:{
      notifications:true,online:true,autoplay:true,theme:"dark"
    };

    this.chats={};
    this.chatMeta={};
    cs.docs.forEach(d=>{
      const x=d.data()||{};
      const participants=x.participants||d.id.split("__");
      if(participants.length>=2){
        const key=this.chatKey(participants[0],participants[1]);
        this.chats[key]=Array.isArray(x.messages)?x.messages:[];
        this.chatMeta[key]=x;
        this.chats[key].forEach(m=>m.reactionBy??={});
      }
    });
  };

  /* REALTIME SYNC — Firestore listeners keep NOVA live without refresh. */
  let realtimeUnsubs=[];
  let realtimeRenderTimer=null;
  const scheduleRealtimeRender=()=>{
    clearTimeout(realtimeRenderTimer);
    realtimeRenderTimer=setTimeout(()=>{
      try{
        if(!auth.session || !modules.db.me())return;
        modules.db.updateNotificationBadge();
        if($("modalBg")?.classList.contains("open") || $("viewer")?.classList.contains("open"))return;
        const active=document.activeElement;
        if(active?.id==="messageInput" || active?.id==="commentInput")return;
        const screen=NOVA.state?.screen||"home";
        NOVA.render(screen);
      }catch(e){ console.error("NOVA realtime render failed:",e); }
    },120);
  };

  modules.db.stopRealtime=function(){
    realtimeUnsubs.forEach(fn=>{try{fn()}catch(e){}});
    realtimeUnsubs=[];
  };

  modules.db.startRealtime=function(uid){
    this.stopRealtime();
    if(!uid)return;

    const watch=(query,apply)=>{
      const unsub=query.onSnapshot(snap=>{
        try{ apply(snap); scheduleRealtimeRender(); }
        catch(e){ console.error("NOVA realtime update failed:",e); }
      },err=>console.error("NOVA realtime listener error:",err));
      realtimeUnsubs.push(unsub);
    };

    watch(fdb.collection("users"),snap=>{
      this.users=snap.docs.map(d=>({id:d.id,...d.data()}));
    });

    watch(fdb.collection("config").doc("owner"),snap=>{
      window.NOVA_OWNER_UID=snap.exists?(snap.data().ownerUid||""):"";
    });

    watch(fdb.collection("posts"),snap=>{
      this.posts=snap.docs.map(d=>({__docId:d.id,...d.data()}));
      this.posts.forEach(p=>{
        p.likes??=[]; p.comments??=[]; p.reactions??={};
        p.savedBy??=[]; p.reposts??=0;
      });
    });

    watch(fdb.collection("stories"),snap=>{
      this.stories=snap.docs.map(d=>({__docId:d.id,...d.data()}));
      this.stories.forEach(st=>{st.reactions??={};st.replies??=[];});
    });

    watch(notifDoc(uid),snap=>{
      this.notifications=snap.exists?(snap.data().items||[]):[];
      this.updateNotificationBadge();
    });

    watch(settingsDoc(uid),snap=>{
      this.settings={notifications:true,online:true,autoplay:true,theme:"dark",...(snap.exists?snap.data():{})};
    });

    watch(fdb.collection("chats").where("participants","array-contains",uid),snap=>{
      this.chats={};
      this.chatMeta={};
      snap.docs.forEach(d=>{
        const x=d.data()||{};
        const participants=x.participants||d.id.split("__");
        if(participants.length>=2){
          const key=this.chatKey(participants[0],participants[1]);
          this.chats[key]=Array.isArray(x.messages)?x.messages:[];
          this.chatMeta[key]=x;
          this.chats[key].forEach(m=>m.reactionBy??={});
          if(key===this.chatKey(uid, participants.find(x=>x!==uid)||"")){
            const other=participants.find(x=>x!==uid);
            const typing=!!x.typing?.[other];
            const el=$("typingStatus");
            if(el)el.textContent=typing?`${this.user(other)?.name||"User"} is typing…`:"";
          }
        }
      });
    });
  };

  modules.db.save=async function(){
    const me=this.me();
    if(!me||!fAuth.currentUser)return false;

    try{
      const batch=fdb.batch();
      batch.set(userDoc(me.id),clean(me),{merge:true});
      batch.set(notifDoc(me.id),{items:(this.notifications||[]).slice(0,100),updated:Date.now()},{merge:true});
      batch.set(settingsDoc(me.id),clean(this.settings||{}),{merge:true});

      /* Only public documents owned by the current user are saved here.
         Chats are saved separately so one oversized/broken chat cannot
         make profile/settings/notifications fail together. */
      for(const p of (this.posts||[])){
        batch.set(fdb.collection("posts").doc(p.id),clean(p),{merge:true});
      }
      for(const st of (this.stories||[])){
        batch.set(fdb.collection("stories").doc(st.id),clean(st),{merge:true});
      }
      await batch.commit();
      this.updateNotificationBadge();
      return true;
    }catch(err){
      console.error("NOVA cloud save failed:",err);
      window.NOVA_ONLINE_ERROR=err?.message||String(err);
      NOVA.toast("Cloud save failed: "+(err?.message||"Firebase error"));
      return false;
    }
  };

  modules.db.savePublic=async function(){
    const me=this.me();
    if(!me)return;
    const jobs=[];
    for(const p of (this.posts||[])){
      jobs.push(fdb.collection("posts").doc(p.id).set(clean(p),{merge:true}));
    }
    for(const st of (this.stories||[])){
      jobs.push(fdb.collection("stories").doc(st.id).set(clean(st),{merge:true}));
    }
    await Promise.all(jobs);
  };

  modules.db.deletePostCloud=async function(id){
    try{
      const p=this.post(id);
      if(p && p.user!==this.me()?.id && !this.isOwner())return false;
      await fdb.collection("posts").doc(id).delete();
      this.posts=(this.posts||[]).filter(x=>x.id!==id);
      return true;
    }catch(e){
      console.error(e);
      NOVA.toast("Could not delete post: "+(e?.message||"Firebase error"));
      return false;
    }
  };

  modules.db.deleteStoryCloud=async function(id,storyOverride){
    try{
      const s=storyOverride||this.stories.find(x=>x.id===id);
      if(s && s.user!==this.me()?.id && !this.isOwner())return false;
      await fdb.collection("stories").doc(id).delete();
      this.stories=(this.stories||[]).filter(x=>x.id!==id);
      return true;
    }catch(e){
      console.error("NOVA story delete failed:",e);
      NOVA.toast("Could not delete story: "+(e?.message||"Firebase error"));
      return false;
    }
  };

  modules.db.setVerified=async function(id,value){
    if(!this.isOwner())return false;
    const u=this.user(id);
    if(!u||u.id===window.NOVA_OWNER_UID)return false;
    u.verified=!!value;
    try{
      await userDoc(id).set({verified:!!value},{merge:true});
      return true;
    }catch(e){
      console.error(e);
      NOVA.toast("Could not update verification");
      return false;
    }
  };

  /* Registration uses Firebase Authentication; no fake/local accounts. */
  auth.session=null;

  auth.register=async function(){
    const n=$("regName").value.trim();
    const e=$("regEmail").value.trim().toLowerCase();
    const p=$("regPass").value;
    const p2=$("regPass2").value;
    let h=$("regHandle").value.trim();
    const ownerId=$("regOwnerId").value.trim();
    const err=$("authBody").querySelector("#authError");

    if(err)err.textContent="";
    if(n.length<2)return err.textContent="Enter your name.";
    if(!e.includes("@"))return err.textContent="Enter a valid email.";
    if(p.length<6)return err.textContent="Password must be at least 6 characters.";
    if(p!==p2)return err.textContent="Passwords do not match.";

    let isOwner=false;
    if(ownerId){
      const hash=await NOVA.hashText(ownerId);
      if(hash!==NOVA_OWNER_CODE_HASH)return err.textContent="Invalid Owner ID.";
      isOwner=true;
    }

    if(!h)h="@"+n.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,14)+Math.floor(Math.random()*90+10);
    if(!h.startsWith("@"))h="@"+h;

    const old=fAuth.currentUser;
    try{
      const cred=await fAuth.createUserWithEmailAndPassword(e,p);
      const fu=cred.user;

      await fu.updateProfile({displayName:n});

      const id=fu.uid;
      const profile={
        id,
        name:n,
        handle:h,
        bio:"New on NOVA 🚀",
        avatar:"",
        followers:0,
        following:0,
        followingUsers:[],likedPosts:[],savedPosts:[],postReactions:{},postComments:[],storyReactions:{},
        online:true,
        verified:!!isOwner,
        owner:!!isOwner,
        created:Date.now()
      };

      await fdb.collection("users").doc(id).set(profile,{merge:true});

      auth.session={userId:id,email:fu.email||e};
      modules.db.users=(Array.isArray(modules.db.users)?modules.db.users:[]).filter(x=>x.id!==id);
      modules.db.users.push(profile);
      modules.db.posts??=[];
      modules.db.stories??=[];
      modules.db.notifications=[];
      modules.db.settings={notifications:true,online:true,autoplay:true,theme:"dark"};
      modules.db.chats={};

      auth.hide();
      NOVA.go("home");
      NOVA.toast(isOwner?"Owner account created 👑":"Account created 🚀");
    }catch(ex){
      console.error(ex);
      let msg=ex?.code||"";
      if(msg==="auth/email-already-in-use")msg="Email already exists in Firebase. Delete the old Firebase Authentication account first, then register again.";
      else if(msg==="auth/invalid-email")msg="Invalid email address.";
      else if(msg==="auth/weak-password")msg="Password must be at least 6 characters.";
      else msg=ex?.message||"Account creation failed.";
      if(err)err.textContent=msg.replace(/^Firebase:\s*/,"");
    }
  };

  auth.login=async function(){
    const e=$("loginEmail").value.trim().toLowerCase();
    const p=$("loginPass").value;
    const err=$("authBody").querySelector("#authError");
    if(err)err.textContent="";
    if(!e||!p)return err.textContent="Enter email and password.";

    const btn=$("authBody").querySelector("button.btn.full");
    if(btn){btn.disabled=true;btn.textContent="Logging in…";}

    try{
      const cred=await fAuth.signInWithEmailAndPassword(e,p);
      const fu=cred.user;
      let profile=await ensureProfile(fu);
      auth.session={userId:profile.id,email:fu.email||e};

      await modules.db.init();
      const u=modules.db.user(profile.id);
      if(u){
        u.online=true;
        u.lastSeen=Date.now();
        await userDoc(profile.id).set({online:true,lastSeen:Date.now()},{merge:true});
      }

      auth.hide();
      NOVA.go("home");
      NOVA.toast("Welcome back ✨");
    }catch(ex){
      console.error(ex);
      let msg=ex?.code||"";
      if(msg==="auth/user-not-found"||msg==="auth/invalid-credential")msg="Account not found or password is incorrect.";
      else if(msg==="auth/wrong-password")msg="Wrong password.";
      else if(msg==="auth/too-many-requests")msg="Too many attempts. Try again later.";
      else if(msg==="auth/invalid-email")msg="Invalid email address.";
      else msg=ex?.message||"Login failed.";
      if(err)err.textContent=msg.replace(/^Firebase:\s*/,"");
    }finally{
      if(btn){btn.disabled=false;btn.textContent="Log in";}
    }
  };

  auth.logout=async function(){
    try{
      const u=modules.db.me();
      if(u)await userDoc(u.id).set({online:false,lastSeen:Date.now()},{merge:true});
      await fAuth.signOut();
    }catch(e){console.error(e);}
    auth.session=null;
    try{modules.db.stopRealtime?.();}catch(e){}
    document.body.classList.remove("chat-open");
    auth.show();
    auth.render("login");
  };

  /* Online presence. */
  setInterval(async()=>{
    const fu=fAuth.currentUser;
    const u=modules.db.me();
    if(!fu||!u)return;
    try{
      u.online=true;
      u.lastSeen=Date.now();
      await userDoc(u.id).set({online:true,lastSeen:Date.now()},{merge:true});
    }catch(e){}
  },30000);

  /* Firebase Auth state is handled by the single APP BOOT listener below. */

  /* Upload media to Cloudinary instead of storing base64 in Firestore. */
  const originalPostSubmit=modules.posts.submit.bind(modules.posts);
  modules.posts.submit=async function(){
    const file=$("postFile")?.files?.[0];
    if(file){
      const info=$("postFileInfo");
      if(info)info.textContent="Uploading…";
      try{
        const url=await uploadFile(file,"nova/posts");
        const i=$("postImagePreview"),v=$("postVideoPreview");
        if(v?.dataset.type==="video"){v.dataset.data=url;}
        else if(i){i.dataset.data=url;}
      }catch(e){
        console.error(e);
        return NOVA.toast("Media upload failed");
      }
    }
    return originalPostSubmit();
  };

  const originalStorySubmit=modules.stories.submit.bind(modules.stories);
  modules.stories.submit=async function(){
    const file=$("storyFile")?.files?.[0];
    if(file){
      const info=$("storyFileInfo");
      if(info)info.textContent="Uploading…";
      try{
        const url=await uploadFile(file,"nova/stories");
        const i=$("storyImagePreview"),v=$("storyVideoPreview");
        if(v?.dataset.type==="video"){v.dataset.data=url;}
        else if(i){i.dataset.data=url;}
      }catch(e){
        console.error(e);
        return NOVA.toast("Media upload failed");
      }
    }
    return originalStorySubmit();
  };

  /* Profile avatar -> Cloudinary. */
  const originalProfileSave=modules.profile.save.bind(modules.profile);
  modules.profile.save=async function(){
    const file=$("editAvatar")?.files?.[0];
    if(file){
      try{
        const url=await uploadFile(file,"nova/avatars");
        const preview=$("editPreview");
        if(preview)preview.dataset.data=url;
      }catch(e){
        console.error(e);
        return NOVA.toast("Avatar upload failed");
      }
    }
    return originalProfileSave();
  };

  /* Chat photo/video -> Cloudinary. */
  const originalMedia=modules.messages.media.bind(modules.messages);
  modules.messages.media=async function(id,type){
    const input=document.createElement("input");
    input.type="file";
    input.accept=type==="image"?"image/*":"video/*";
    input.onchange=async()=>{
      const f=input.files[0];
      if(!f)return;
      try{
        NOVA.toast("Uploading…");
        const data=await uploadFile(f,"nova/messages");
        const msg=modules.db.sendMessage(id,{kind:type,data,name:f.name});
        if(msg){
          
          this.chat(id);
          NOVA.toast(type==="image"?"Photo sent":"Video sent");
        }
      }catch(e){
        console.error(e);
        NOVA.toast("Media upload failed");
      }
    };
    input.click();
  };

  /* Voice -> Cloudinary. */
  const originalRecord=modules.messages.record.bind(modules.messages);
  modules.messages.record=async function(id){
    if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)
      return NOVA.toast("Voice recording is not supported in this browser");
    if(NOVA.recording)return;
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const chunks=[];
      let mime="";
      if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus"))mime="audio/webm;codecs=opus";
      else if(MediaRecorder.isTypeSupported("audio/webm"))mime="audio/webm";
      const rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
      NOVA.recording=rec;
      NOVA.recordingStarted=Date.now();
      $("voiceBtn")?.classList.add("recording");
      rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      rec.onstop=async()=>{
        stream.getTracks().forEach(t=>t.stop());
        const duration=Math.max(1,Math.round((Date.now()-NOVA.recordingStarted)/1000));
        try{
          NOVA.toast("Uploading voice…");
          const blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});
          const ext=(rec.mimeType||"").includes("ogg")?"ogg":"webm";
          const file=new File([blob],"voice."+ext,{type:blob.type});
          const url=await uploadFile(file,"nova/voice");
          const msg=modules.db.sendMessage(id,{kind:"voice",data:url,duration,voiceLiked:[]});
          if(msg){
            
            this.chat(id);
            NOVA.toast("Voice sent");
          }
        }catch(e){
          console.error(e);
          NOVA.toast("Voice upload failed");
        }finally{
          NOVA.recording=null;
          $("voiceBtn")?.classList.remove("recording");
        }
      };
      rec.start();
    }catch(e){
      console.error(e);
      NOVA.toast("Microphone permission is required");
    }
  };

  /* Replace chat background base64 with a Cloudinary URL. */
  const originalTheme=modules.messages.theme.bind(modules.messages);
  modules.messages.theme=async function(id){
    /* Preserve the original UI/theme flow when no new upload is involved. */
    return originalTheme(id);
  };

  window.NOVA_UPLOAD_FILE=uploadFile;
})();

modules.db.me().id,

let me=modules.db.me().id;

}else{

Math.min(80,ev.clientX-startX)

if(dx>=60){

clearTimeout(
NOVA.state.pressTimer
);

}

}

};

clearTimeout(
NOVA.state.pressTimer
);

let dx=e.clientX-startX;

b.style.transform="";

document.removeEventListener(
"pointermove",
move
);

document.removeEventListener(
"pointerup",
up
);

if(dx>=60){

modules.messages.chat(
NOVA.state.activeChat
);

setTimeout(
()=>$("messageInput")?.focus(),
40
)

}

};

);

    /* Wait for Firebase Auth's first state callback. */
    if(window.NOVA_FIREBASE?.auth){
      await new Promise(resolve=>{
        let done=false;
        const unsub=window.NOVA_FIREBASE.auth.onAuthStateChanged(async user=>{
          if(done)return;
          done=true;
          unsub();
          if(!user){
            auth.show();
            auth.render("login");
            resolve();
            return;
          }
          try{
            const profile=await (async()=>{
              const snap=await window.NOVA_FIREBASE.db.collection("users").doc(user.uid).get();
              if(snap.exists)return {id:user.uid,...snap.data()};
              const p={
                id:user.uid,name:user.displayName||"NOVA User",
                handle:"@"+(user.displayName||"novauser").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,14)+Math.floor(Math.random()*90+10),
                bio:"New on NOVA 🚀",avatar:"",followers:0,following:0,
                followingUsers:[],online:true,verified:false,created:Date.now()
              };
              await window.NOVA_FIREBASE.db.collection("users").doc(user.uid).set(p,{merge:true});
              return p;
            })();
            auth.session={userId:profile.id,email:user.email||""};
            await modules.db.init();
            auth.hide();
            NOVA.go("home");
          }catch(e){
            console.error(e);
            auth.show();
            auth.render("login");
            const er=$("authBody").querySelector("#authError");
            if(er)er.textContent="Could not load NOVA data: "+(e?.message||"Firebase error");
          }
          resolve();
        });
      });
    }else{
      auth.show();
      auth.render("login");
    }
  }catch(e){
    console.error(e);
    auth.show();
    auth.render("login");
  }
})();

/* Keep the current user online in Firestore. */
setInterval(async()=>{
  try{
    const fu=window.NOVA_FIREBASE?.auth?.currentUser;
    const u=modules.db.me();
    if(fu&&u){
      u.online=true;
      u.lastSeen=Date.now();
      await window.NOVA_FIREBASE.db.collection("users").doc(u.id).set({
        online:true,lastSeen:Date.now()
      },{merge:true});
    }
  }catch(e){}
},15000);

/* STOP MEDIA */

window.addEventListener("beforeunload",()=>{

try{

let v=$("storyVideo");

if(v)
v.pause();

document.querySelectorAll("audio")
.forEach(a=>a.pause());

let u=modules.db.me();

if(u){
u.online=false;
modules.db.save()
}

}catch(e){}

});

/* iOS keyboard: keep composer visible */
window.visualViewport?.addEventListener("resize",()=>{

if(!document.body.classList.contains("chat-open"))
return;

let chat=document.querySelector(".chat");

if(!chat)return;

requestAnimationFrame(()=>{
let input=$("messageInput");

if(
document.activeElement===input
){
setTimeout(()=>{
let box=$("chatMessages");
if(box)box.scrollTop=box.scrollHeight
},80)
}
})

});
</script>
